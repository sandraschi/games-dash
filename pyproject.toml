[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "games-mcp"
version = "0.1.0"
description = "SOTA Games MCP Server - Complete chess, Go, Shogi analysis and game management via Claude/Cursor"
authors = [
    {name = "FlowEngineer", email = "sandraschi@proton.me"}
]
dependencies = [
    "fastmcp>=0.9.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "sqlite3",  # Built-in
    "asyncio",  # Built-in
    "logging",  # Built-in
    "json",     # Built-in
    "pathlib",  # Built-in
    "datetime", # Built-in
    "typing",   # Built-in
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["games", "chess", "go", "shogi", "mcp", "analysis", "automation"]

[project.urls]
Homepage = "https://github.com/sandraschi/games-mcp"
Repository = "https://github.com/sandraschi/games-mcp"
Issues = "https://github.com/sandraschi/games-mcp/issues"
Documentation = "https://games-mcp.readthedocs.io/"

[project.scripts]
games-mcp = "games_mcp.mcp_server:main"

[tool.setuptools]
packages = ["games_mcp"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
games_mcp = ["*.md", "*.txt"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["S101", "S104", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["games_mcp"]
