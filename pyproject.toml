[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-games-collection-mcp"
version = "2.6.0"
description = "SOTA AI Games Collection MCP Server - Complete chess, Go, Shogi analysis and game management via Claude/Cursor"
authors = [
    {name = "FlowEngineer", email = "sandraschi@proton.me"}
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "aiohttp>=3.8.0",
    "httpx>=0.27",
    "pydantic>=2.0.0",
    "aiohttp-cors>=0.8.1",
    "open-spiel>=1.6.11",
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
    "firebase-admin>=6.6.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["games", "chess", "go", "shogi", "mcp", "analysis", "automation"]

[project.scripts]
ai-games-collection-mcp = "ai_games_collection_mcp.mcp_server:main"

[project.optional-dependencies]
http = [
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
]

[tool.setuptools]
packages = ["ai_games_collection_mcp"]
package-dir = {"" = "ai-games-collection-mcp/src"}

[tool.setuptools.package-data]
ai_games_collection_mcp = ["*.md", "*.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "ai-games-collection-mcp/test_mcp_server.py",
    "ai-games-collection-mcp/validate_mcp.py",
    "ai-games-collection-mcp/bridge.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "S104", "COM812", "ISC001", "E501", "N999"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101", "PLR2004", "E402"]
"src/ai_games_collection_mcp/enhanced_ai_manager.py" = ["F401", "F821"]
"src/ai_games_collection_mcp/services/ai/minimax.py" = ["E701"]
"src/ai_games_collection_mcp/tools/management.py" = ["N806"]
"engines/*.py" = ["E501", "E722", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["ai_games_collection_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
