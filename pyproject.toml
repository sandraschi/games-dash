[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "src/games_mcp",
    "src/games_mcp_SUPERSEDED",
    "backend",
    "scripts",
    "_llm_test_scripts",
    "games-mcp/test_mcp_server.py",
    "games-mcp/validate_mcp.py",
    "games-mcp/bridge.py",
]

[tool.ruff.lint.per-file-ignores]
"engines/*.py" = ["E722", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
