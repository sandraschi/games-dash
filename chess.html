<!DOCTYPE html>

    <!-- Using REAL Stockfish C++ engine via backend (not JavaScript!) -->
    <style>
        /* Board sizing now handled by responsive-boards.css */
        #chessBoard {
            /* Responsive sizing via CSS - optimized for iPad 4:3 */
        }

        .square {
            /* Responsive sizing via CSS */
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.selected {
            background-color: #7fc97f !important;
        }

        .square.valid-move {
            background-color: #9fdf9f !important;
        }

        .square.ai-move-from {
            background-color: #FFD700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .square.ai-move-to {
            background-color: #FF6B6B !important;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.8);
        }

        .square:hover {
            opacity: 0.8;
        }

        .captured-pieces {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .captured-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
        }

        .captured-section h3 {
            margin-bottom: 10px;
        }

        .pieces {
            font-size: 30px;
        }

        /* SVG Chess Piece Mobile Fixes */
        @media (max-width: 768px) {
            /* SVG pieces need padding from square borders */
            .square svg {
                margin: 2px !important;
                width: calc(100% - 4px) !important;
                height: calc(100% - 4px) !important;
            }

            /* Black SVG pieces are slightly too large - reduce them */
            .square svg text {
                font-size: 48px !important; /* Reduced from 56px */
            }

            /* Ensure SVG text is properly centered */
            .square svg text {
                dominant-baseline: central !important;
                text-anchor: middle !important;
            }

            /* Classic pieces look good, but ensure proper sizing */
            .square.classic-pieces {
                font-size: 28px !important; /* Slightly smaller for mobile */
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
        }

        /* Ensure SVG pieces don't overflow squares */
        .square svg {
            max-width: 100%;
            max-height: 100%;
            box-sizing: border-box;
        }

        /* Fix black piece sizing specifically */
        .square svg text[fill="#000000"],
        .square svg text[fill="#000"] {
            font-size: 52px; /* Slightly smaller for black pieces */
        }

        @media (max-width: 768px) {
            .square svg text[fill="#000000"],
            .square svg text[fill="#000"] {
                font-size: 44px !important; /* Even smaller on mobile */
            }
        }
    </style>

        // Multiple piece sets to choose from

        // Create SVG chess piece (using Unicode symbols as scalable SVG text - much better quality)
        function createSVGPiece(color, type) {
            const unicodePieces = {
                white: { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
                black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
            };
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '70');
            svg.setAttribute('height', '70');
            svg.setAttribute('viewBox', '0 0 70 70');
            svg.style.display = 'block';
            svg.style.margin = '0 auto';
            
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '35');
            text.setAttribute('y', '50');
            text.setAttribute('font-size', '56');
            text.setAttribute('font-family', 'Arial, sans-serif');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            
            if (color === 'white') {
                // White pieces: white fill with dark stroke for visibility on light squares
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('stroke', '#333333');
                text.setAttribute('stroke-width', '1.5');
                text.setAttribute('stroke-linejoin', 'round');
                text.style.fontWeight = 'bold';
            } else {
                // Black pieces: black fill
                text.setAttribute('fill', '#000000');
                text.style.fontWeight = 'bold';
            }
            
            text.textContent = unicodePieces[color][type];
            
            svg.appendChild(text);
            return svg;
        }

        function initBoard() {
            board = [
                [{type: 'rook', color: 'black'}, {type: 'knight', color: 'black'}, {type: 'bishop', color: 'black'}, {type: 'queen', color: 'black'}, {type: 'king', color: 'black'}, {type: 'bishop', color: 'black'}, {type: 'knight', color: 'black'}, {type: 'rook', color: 'black'}],
                Array(8).fill(null).map(() => ({type: 'pawn', color: 'black'})),
                Array(8).fill(null),
                Array(8).fill(null),
                Array(8).fill(null),
                Array(8).fill(null),
                Array(8).fill(null).map(() => ({type: 'pawn', color: 'white'})),
                [{type: 'rook', color: 'white'}, {type: 'knight', color: 'white'}, {type: 'bishop', color: 'white'}, {type: 'queen', color: 'white'}, {type: 'king', color: 'white'}, {type: 'bishop', color: 'white'}, {type: 'knight', color: 'white'}, {type: 'rook', color: 'white'}]
            ];
        }

        function renderBoard() {
            const boardElement = document.getElementById('chessBoard');
            if (!boardElement) {
                console.error('chessBoard element not found');
                return;
            }
            
            if (!board || board.length === 0) {
                console.error('Board not initialized');
                initBoard();
            }
            
            boardElement.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const displayRow = boardFlipped ? 7 - row : row;
                    const displayCol = boardFlipped ? 7 - col : col;
                    
                    const square = document.createElement('div');
                    square.className = `square ${(displayRow + displayCol) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;

                    const piece = board[row] && board[row][col];
                    if (piece) {
                        const pieceSet = PIECE_SETS[currentPieceSet];
                        if (pieceSet) {
                            if (pieceSet.type === 'svg') {
                                const svgPiece = createSVGPiece(piece.color, piece.type);
                                square.appendChild(svgPiece);
                            } else {
                                square.textContent = pieceSet[piece.color][piece.type];
                            }
                        }
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardElement.appendChild(square);
                }
            }

            updateStatus();
            updateCapturedPieces();
        }
        
        function flipBoard() {
            boardFlipped = !boardFlipped;
            renderBoard();
            console.log('Board flipped:', boardFlipped ? 'Black perspective' : 'White perspective');
        }

        function handleSquareClick(row, col) {
            if (selectedSquare) {
                const [selectedRow, selectedCol] = selectedSquare;
                if (isValidMove(selectedRow, selectedCol, row, col)) {
                    makeMove(selectedRow, selectedCol, row, col);
                }
                clearSelection();
            } else {
                const piece = board[row][col];
                if (piece && piece.color === currentPlayer) {
                    selectedSquare = [row, col];
                    highlightValidMoves(row, col);
                }
            }
        }

        function highlightValidMoves(row, col) {
            const squares = document.querySelectorAll('.square');
            squares.forEach(square => {
                const r = parseInt(square.dataset.row);
                const c = parseInt(square.dataset.col);
                if (r === row && c === col) {
                    square.classList.add('selected');
                } else if (isValidMove(row, col, r, c)) {
                    square.classList.add('valid-move');
                }
            });
        }

        function clearSelection() {
            selectedSquare = null;
            document.querySelectorAll('.square').forEach(square => {
                square.classList.remove('selected', 'valid-move');
            });
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            if (fromRow === toRow && fromCol === toCol) return false;

            const piece = board[fromRow][fromCol];
            const target = board[toRow][toCol];

            if (!piece) return false;
            if (target && target.color === piece.color) return false;

            const rowDiff = toRow - fromRow;
            const colDiff = toCol - fromCol;
            const absRowDiff = Math.abs(rowDiff);
            const absColDiff = Math.abs(colDiff);

            switch (piece.type) {
                case 'pawn':
                    const direction = piece.color === 'white' ? -1 : 1;
                    const startRow = piece.color === 'white' ? 6 : 1;
                    
                    if (colDiff === 0 && !target) {
                        if (rowDiff === direction) return true;
                        if (fromRow === startRow && rowDiff === 2 * direction && !board[fromRow + direction][fromCol]) return true;
                    }
                    if (absColDiff === 1 && rowDiff === direction && target) return true;
                    return false;

                case 'rook':
                    if (rowDiff === 0 || colDiff === 0) {
                        return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'knight':
                    return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);

                case 'bishop':
                    if (absRowDiff === absColDiff) {
                        return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'queen':
                    if (rowDiff === 0 || colDiff === 0 || absRowDiff === absColDiff) {
                        return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                    }
                    return false;

                case 'king':
                    return absRowDiff <= 1 && absColDiff <= 1;
            }

            return false;
        }

        function isPathBlocked(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
            const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;

            let currentRow = fromRow + rowStep;
            let currentCol = fromCol + colStep;

            while (currentRow !== toRow || currentCol !== toCol) {
                if (board[currentRow][currentCol]) return true;
                currentRow += rowStep;
                currentCol += colStep;
            }

            return false;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const captured = board[toRow][toCol];

            moveHistory.push({
                from: {row: fromRow, col: fromCol},
                to: {row: toRow, col: toCol},
                piece: piece,
                captured: captured
            });

            if (captured) {
                if (currentPlayer === 'white') {
                    whiteCaptured.push(captured);
                } else {
                    blackCaptured.push(captured);
                }
            }

            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;

            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            
            // Update timer
            if (typeof window.switchTimer === 'function') {
                window.switchTimer(currentPlayer);
            }
            
            renderBoard();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            const lastMove = moveHistory.pop();
            board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
            board[lastMove.to.row][lastMove.to.col] = lastMove.captured;

            if (lastMove.captured) {
                if (currentPlayer === 'black') {

        function boardToFEN() {
            let fen = '';
            
            // Board position
            for (let row = 0; row < 8; row++) {
                let emptyCount = 0;
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (!piece) {
                        emptyCount++;
                    } else {
                        if (emptyCount > 0) {
                            fen += emptyCount;
                            emptyCount = 0;
                        }
                        const pieceChar = getPieceFEN(piece);
                        fen += pieceChar;
                    }
                }
                if (emptyCount > 0) fen += emptyCount;
                if (row < 7) fen += '/';
            }
            
            // Active color
            fen += ' ' + (currentPlayer === 'white' ? 'w' : 'b');
            
            // Castling rights (simplified - assume all available at start)
            fen += ' KQkq';
            
            // En passant target square (simplified)
            fen += ' -';
            
            // Halfmove clock (simplified)
            fen += ' 0';
            
            // Fullmove number
            fen += ' ' + Math.floor(moveHistory.length / 2 + 1);
            
            return fen;
        }
        
        function getPieceFEN(piece) {
            const pieceMap = {
                'pawn': 'p', 'knight': 'n', 'bishop': 'b',
                'rook': 'r', 'queen': 'q', 'king': 'k'
            };
            const char = pieceMap[piece.type];
            return piece.color === 'white' ? char.toUpperCase() : char;
        }

        function playMoveSound() {
            // Create a simple beep sound using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Configure sound (pleasant "click" tone)
            oscillator.frequency.value = 800; // Hz
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // ===== CHEAT FUNCTIONS =====

        // Take back the last move
        function cheatTakeBack() {
            if (moveHistory.length === 0) {
                alert('❌ No moves to take back!');
                return;

            const lastMove = moveHistory.pop();

            // Restore the board state
            board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
            board[lastMove.to.row][lastMove.to.col] = lastMove.captured;

            // Restore captured pieces
            if (lastMove.captured) {
                if (lastMove.captured.color === 'white') {
                    whiteCaptured.splice(whiteCaptured.indexOf(lastMove.captured), 1);
                } else {
                    blackCaptured.splice(blackCaptured.indexOf(lastMove.captured), 1);
                }
            }

            // Switch turns back
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';

            // Update display
            updateBoard();
            updateStatus();

            // Remove the move from game history for PGN
            if (gameMoves.length > 0) {
                gameMoves.pop();
            }

            playMoveSound();
        }

        // Show position evaluation
        function cheatShowEval() {
            // Get current FEN
            const fen = boardToFEN();

            // Show evaluation in status
            const statusEl = document.getElementById('status');

            // Simple heuristic evaluation for now
            let evaluation = evaluatePosition();

            if (evaluation > 0) {
                statusEl.textContent = `📊 Position: White +${evaluation.toFixed(1)} (better)`;
            } else if (evaluation < 0) {
                statusEl.textContent = `📊 Position: Black +${Math.abs(evaluation).toFixed(1)} (better)`;
            } else {
                statusEl.textContent = `📊 Position: Equal (±0.0)`;
            }

            // Reset status after 3 seconds
            setTimeout(() => {
                updateStatus();
            }, 3000);
        }

        // Simple position evaluation
        function evaluatePosition() {
            let score = 0;

            // Material count
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        let value = 0;
                        switch (piece.type) {
                            case 'pawn': value = 1; break;
                            case 'knight': case 'bishop': value = 3; break;
                            case 'rook': value = 5; break;
                            case 'queen': value = 9; break;
                            case 'king': value = 0; break; // King has no material value
                        }

                        if (piece.color === 'white') {
                            score += value;
                        } else {
                            score -= value;
                        }
                    }
                }
            }

            // Positional factors (simplified)
            // Center control, piece development, etc. would go here

            return score;
        }

        // Initialize device adaptive system
        if (window.DeviceAdaptive) {
            const adaptiveLayout = window.DeviceAdaptive.adaptGameLayout(
                document.querySelector('.container'),
                'chess'
            );
            console.log('♟️ Chess adapted for:', adaptiveLayout);

            // Apply adaptive canvas sizing
            const canvasSize = window.DeviceAdaptive.getRecommendedCanvasSize('chess');
            const boardElement = document.getElementById('chessBoard');
            if (boardElement) {
                boardElement.style.width = `${canvasSize.width}px`;
                boardElement.style.height = `${canvasSize.height}px`;
            }
        }

        // Initialize game
        newGame();
    </script>
