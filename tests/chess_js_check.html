          // Create SVG chess piece (using Unicode symbols as scalable SVG text - much better quality)
          function createSVGPiece(color, type) {
              const unicodePieces = {
                  white: { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
                  black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
              };
              
              const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
              svg.setAttribute('width', '70');
              svg.setAttribute('height', '70');
              svg.setAttribute('viewBox', '0 0 70 70');
              svg.style.display = 'block';
              svg.style.margin = '0 auto';
              
              const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              text.setAttribute('x', '35');
              text.setAttribute('y', '45');
              text.setAttribute('font-size', '52');
              text.setAttribute('font-family', 'Arial, sans-serif');
              text.setAttribute('text-anchor', 'middle');
              text.setAttribute('dominant-baseline', 'middle');
              
              if (color === 'white') {
                  // White pieces: white fill with dark stroke for visibility on light squares
                  text.setAttribute('fill', '#ffffff');
                  text.setAttribute('stroke', '#333333');
                  text.setAttribute('stroke-width', '1.5');
                  text.setAttribute('stroke-linejoin', 'round');
                  text.style.fontWeight = 'bold';
              } else {
                  // Black pieces: black fill
                  text.setAttribute('fill', '#000000');
                  text.style.fontWeight = 'bold';
              }
              
              text.textContent = unicodePieces[color][type];
              
              svg.appendChild(text);
              return svg;
          }
  
          function initBoard() {
              board = [
                  [{type: 'rook', color: 'black'}, {type: 'knight', color: 'black'}, {type: 'bishop', color: 'black'}, {type: 'queen', color: 'black'}, {type: 'king', color: 'black'}, {type: 'bishop', color: 'black'}, {type: 'knight', color: 'black'}, {type: 'rook', color: 'black'}],
                  Array(8).fill(null).map(() => ({type: 'pawn', color: 'black'})),
                  Array(8).fill(null),
                  Array(8).fill(null),
                  Array(8).fill(null),
                  Array(8).fill(null),
                  Array(8).fill(null).map(() => ({type: 'pawn', color: 'white'})),
                  [{type: 'rook', color: 'white'}, {type: 'knight', color: 'white'}, {type: 'bishop', color: 'white'}, {type: 'queen', color: 'white'}, {type: 'king', color: 'white'}, {type: 'bishop', color: 'white'}, {type: 'knight', color: 'white'}, {type: 'rook', color: 'white'}]
              ];
          }
  
          function renderBoard() {
              try {
                  console.log('🎨 Rendering chess board...');
                  
                  const boardElement = document.getElementById('chessBoard');
                  if (!boardElement) {
                      throw new Error('chessBoard element not found');
                  }
                  
                  if (!board || board.length === 0) {
                      console.warn('⚠️ Board not initialized, initializing now...');
                      initBoard();
                  }
                  
                  // Clear existing board
                  boardElement.innerHTML = '';
  
                  // Create board squares
                  for (let row = 0; row < 8; row++) {
                      for (let col = 0; col < 8; col++) {
                          const displayRow = boardFlipped ? 7 - row : row;
                          const displayCol = boardFlipped ? 7 - col : col;
                          
                          const square = document.createElement('div');
                          square.className = `square ${(displayRow + displayCol) % 2 === 0 ? 'light' : 'dark'}`;
                          square.dataset.row = row;
                          square.dataset.col = col;
  
                          // Add piece if present
                          const piece = board[row] && board[row][col];
                          if (piece) {
                              try {
                                  const pieceSet = PIECE_SETS[currentPieceSet];
                                  if (pieceSet) {
                                      if (pieceSet.type === 'svg') {
                                          const svgPiece = createSVGPiece(piece.color, piece.type);
                                          if (svgPiece) {
                                              square.appendChild(svgPiece);
                                          } else {
                                              console.warn('⚠️ Failed to create SVG piece:', piece);
                                              square.textContent = pieces[piece.color][piece.type];
                                          }
                                      } else {
                                          square.textContent = pieceSet[piece.color][piece.type];
                                      }
                                  } else {
                                      console.warn('⚠️ Piece set not found, using default');
                                      square.textContent = pieces[piece.color][piece.type];
                                  }
                              } catch (pieceError) {
                                  console.error('❌ Failed to render piece:', piece, pieceError);
                                  square.textContent = pieces[piece.color][piece.type];
                              }
                          }
  
                          // Add click handler
                          try {
                              square.onclick = () => handleSquareClick(row, col);
                          } catch (clickError) {
                              console.error('❌ Failed to add click handler:', clickError);
                          }
                          
                          boardElement.appendChild(square);
                      }
                  }
  
                  // Update game status and captured pieces
                  try {
                      updateStatus();
                      updateCapturedPieces();
                  } catch (updateError) {
                      console.warn('⚠️ Failed to update status/captured pieces:', updateError);
                  }
                  
                  console.log('✅ Board rendered successfully');
                  
              } catch (error) {
                  console.error('❌ Board rendering failed:', error);
                  
                  // Try to show error on the board
                  const boardElement = document.getElementById('chessBoard');
                  if (boardElement) {
                      boardElement.innerHTML = `
                          <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #FF6B6B; text-align: center; padding: 20px;">
                              <div>
                                  <strong>⚠️ Board Rendering Failed</strong><br>
                                  ${error.message}<br>
                                  <small>Please refresh the page</small>
                              </div>
                          </div>
                      `;
                  }
              }
          }
          
          function flipBoard() {
              boardFlipped = !boardFlipped;
              renderBoard();
              console.log('Board flipped:', boardFlipped ? 'Black perspective' : 'White perspective');
          }
  
          function handleSquareClick(row, col) {
              if (selectedSquare) {
                  const [selectedRow, selectedCol] = selectedSquare;
                  if (isValidMove(selectedRow, selectedCol, row, col)) {
                      makeMove(selectedRow, selectedCol, row, col);
                  }
                  clearSelection();
              } else {
                  const piece = board[row][col];
                  if (piece && piece.color === currentPlayer) {
                      selectedSquare = [row, col];
                      highlightValidMoves(row, col);
                  }
              }
          }
  
          function highlightValidMoves(row, col) {
              const squares = document.querySelectorAll('.square');
              squares.forEach(square => {
                  const r = parseInt(square.dataset.row);
                  const c = parseInt(square.dataset.col);
                  if (r === row && c === col) {
                      square.classList.add('selected');
                  } else if (isValidMove(row, col, r, c)) {
                      square.classList.add('valid-move');
                  }
              });
          }
  
          function clearSelection() {
              selectedSquare = null;
              document.querySelectorAll('.square').forEach(square => {
                  square.classList.remove('selected', 'valid-move');
              });
          }
  
          function isValidMove(fromRow, fromCol, toRow, toCol) {
              if (fromRow === toRow && fromCol === toCol) return false;
  
              const piece = board[fromRow][fromCol];
              const target = board[toRow][toCol];
  
              if (!piece) return false;
              if (target && target.color === piece.color) return false;
  
              const rowDiff = toRow - fromRow;
              const colDiff = toCol - fromCol;
              const absRowDiff = Math.abs(rowDiff);
              const absColDiff = Math.abs(colDiff);
  
              switch (piece.type) {
                  case 'pawn':
                      const direction = piece.color === 'white' ? -1 : 1;
                      const startRow = piece.color === 'white' ? 6 : 1;
                      
                      if (colDiff === 0 && !target) {
                          if (rowDiff === direction) return true;
                          if (fromRow === startRow && rowDiff === 2 * direction && !board[fromRow + direction][fromCol]) return true;
                      }
                      if (absColDiff === 1 && rowDiff === direction && target) return true;
                      return false;
  
                  case 'rook':
                      if (rowDiff === 0 || colDiff === 0) {
                          return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                      }
                      return false;
  
                  case 'knight':
                      return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);
  
                  case 'bishop':
                      if (absRowDiff === absColDiff) {
                          return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                      }
                      return false;
  
                  case 'queen':
                      if (rowDiff === 0 || colDiff === 0 || absRowDiff === absColDiff) {
                          return !isPathBlocked(fromRow, fromCol, toRow, toCol);
                      }
                      return false;
  
                  case 'king':
                      return absRowDiff <= 1 && absColDiff <= 1;
              }
  
              return false;
          }
  
          function isPathBlocked(fromRow, fromCol, toRow, toCol) {
              const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
              const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
  
              let currentRow = fromRow + rowStep;
              let currentCol = fromCol + colStep;
  
              while (currentRow !== toRow || currentCol !== toCol) {
                  if (board[currentRow][currentCol]) return true;
                  currentRow += rowStep;
                  currentCol += colStep;
              }
  
              return false;
          }
  
          function makeMove(fromRow, fromCol, toRow, toCol) {
              const piece = board[fromRow][fromCol];
              const captured = board[toRow][toCol];
  
              moveHistory.push({
                  from: {row: fromRow, col: fromCol},
                  to: {row: toRow, col: toCol},
                  piece: piece,
                  captured: captured
              });
  
              if (captured) {
                  if (currentPlayer === 'white') {
                      whiteCaptured.push(captured);
                  } else {
                      blackCaptured.push(captured);
                  }
                  // Play capture sound
                  if (window.gameSound) {
                      window.gameSound.playSound('chess_capture', { gameType: 'chess' });
                  }
              } else {
                  // Play move sound
                  if (window.gameSound) {
                      window.gameSound.playSound('chess_move', { gameType: 'chess' });
                  }
              }
  
              board[toRow][toCol] = piece;
              board[fromRow][fromCol] = null;
  
              currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
  
              // Update timer
              if (typeof window.switchTimer === 'function') {
                  window.switchTimer(currentPlayer);
              }
  
              renderBoard();
          }
  
          function undoMove() {
              if (moveHistory.length === 0) return;
  
              const lastMove = moveHistory.pop();
              board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
              board[lastMove.to.row][lastMove.to.col] = lastMove.captured;
  
              if (lastMove.captured) {
                  if (currentPlayer === 'black') {
                      whiteCaptured.pop();
                  } else {
                      blackCaptured.pop();
                  }
              }
  
              currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
              renderBoard();
          }
  
          function updateStatus() {
              const status = document.getElementById('status');
              status.textContent = `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s Turn`;
          }
  
          function updateCapturedPieces() {
              const pieceSet = PIECE_SETS[currentPieceSet];
              const whiteEl = document.getElementById('whiteCaptured');
              const blackEl = document.getElementById('blackCaptured');
              
              whiteEl.innerHTML = '';
              blackEl.innerHTML = '';
              
              if (pieceSet.type === 'svg') {
                  whiteCaptured.forEach(p => {
                      const svg = createSVGPiece(p.color, p.type);
                      svg.setAttribute('width', '28');
                      svg.setAttribute('height', '28');
                      svg.setAttribute('viewBox', '0 0 70 70');
                      // Update text element for smaller size
                      const text = svg.querySelector('text');
                      if (text) {
                          text.setAttribute('font-size', '22');
                          text.setAttribute('x', '35');
                          text.setAttribute('y', '45');
                          text.setAttribute('dominant-baseline', 'middle');
                          if (p.color === 'white') {
                              text.setAttribute('stroke-width', '0.8');
                          }
                      }
                      svg.style.display = 'inline-block';
                      svg.style.margin = '0 2px';
                      svg.style.verticalAlign = 'middle';
                      whiteEl.appendChild(svg);
                  });
                  blackCaptured.forEach(p => {
                      const svg = createSVGPiece(p.color, p.type);
                      svg.setAttribute('width', '28');
                      svg.setAttribute('height', '28');
                      svg.setAttribute('viewBox', '0 0 70 70');
                      // Update text element for smaller size
                      const text = svg.querySelector('text');
                      if (text) {
                          text.setAttribute('font-size', '22');
                          text.setAttribute('x', '35');
                          text.setAttribute('y', '45');
                          text.setAttribute('dominant-baseline', 'middle');
                      }
                      svg.style.display = 'inline-block';
                      svg.style.margin = '0 2px';
                      svg.style.verticalAlign = 'middle';
                      blackEl.appendChild(svg);
                  });
              } else {
                  whiteEl.textContent = whiteCaptured.map(p => pieceSet[p.color][p.type]).join(' ');
                  blackEl.textContent = blackCaptured.map(p => pieceSet[p.color][p.type]).join(' ');
              }
          }
          
          function cyclePieceSet() {
              currentPieceSet = (currentPieceSet + 1) % PIECE_SETS.length;
              const setName = PIECE_SETS[currentPieceSet].name;
              document.getElementById('pieceSetBtn').textContent = `🎨 Pieces: ${setName}`;
              renderBoard();
              updateCapturedPieces();
          }
  
          function toggleSound() {
              if (window.gameSound) {
                  const isEnabled = window.gameSound.isEnabled;
                  if (isEnabled) {
                      window.gameSound.disable();
                      document.getElementById('soundToggle').textContent = '🔇 Sound: Off';
                  } else {
                      window.gameSound.enable();
                      document.getElementById('soundToggle').textContent = '🔊 Sound: On';
                  }
              } else {
                  alert('Sound system not available. Make sure the sound service is running.');
              }
          }
  
          function newGame() {
              try {
                  console.log('🎮 Starting new chess game...');
                  
                  // Initialize board state
                  initBoard();
                  
                  // Reset game state
                  currentPlayer = 'white';
                  whiteCaptured = [];
                  blackCaptured = [];
                  moveHistory = [];
                  selectedSquare = null;
                  
                  // Clear AI state
                  aiThinkingNow = false;
                  
                  // Reset status
                  const statusEl = document.getElementById('status');
                  if (statusEl) {
                      statusEl.textContent = 'White to move';
                  }
                  
                  // Clear AI move highlights
                  clearAIMoveHighlight();
                  
                  // Start timer for white if enabled
                  if (typeof window.startTimer === 'function') {
                      try {
                          window.startTimer('white');
                      } catch (timerError) {
