version: '3.8'

services:
  games-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GAMES_MCP_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]

