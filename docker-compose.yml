# Docker Compose for Games Collection (Hybrid Setup with Remote AI Access)
# **Timestamp**: 2025-12-17
#
# HYBRID ARCHITECTURE FOR REMOTE ACCESS:
# - Linux container: Web server + API proxy for remote access
# - Windows host: AI engines (Stockfish, YaneuraOu, KataGo) - run with .\START_ALL_SERVERS.ps1
#
# IMPORTANT: AI engines are Windows .exe files and CANNOT run in Linux containers!
# But we can proxy API calls from Docker to Windows host for seamless remote access.

version: '3.8'

services:
  # Web server with API proxy for remote access (Linux container)
  games-collection-web:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: games-collection-web
    ports:
      - "11876:80"        # Web interface - ACCESSIBLE FROM IPAD
      - "11001:5001"      # JLPT API Server
      - "11003:5003"      # Kanji Database API
      # AI ports removed - container proxies to Windows host, doesn't expose them
    volumes:
      # Mount code for development (hot reload)
      - ./:/app:ro
      # Mount data directory as writable for database access
      - ./data:/app/data:rw
    restart: unless-stopped
    networks:
      - games-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - AI_SERVER_HOST=host.docker.internal
      - DOCKER_REMOTE_ACCESS=true
    # Enable host networking for Windows Docker Desktop compatibility
    # This allows the container to access Windows host services
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: API proxy service for better remote connectivity
  # Uncomment if you have connectivity issues
  # api-proxy:
  #   image: nginx:alpine
  #   container_name: games-api-proxy
  #   ports:
  #     - "9543:9543"
  #     - "9544:9544"
  #     - "9545:9545"
  #     - "9877:9877"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - games-collection-web
  #   networks:
  #     - games-network
  #   restart: unless-stopped

networks:
  games-network:
    driver: bridge

