# Games Collection - Docker Compose (full engine stack)
#
# All three AI engines run in Docker containers:
#   - Stockfish (Linux, compiled from source)
#   - KataGo  (Linux, downloaded from GitHub)
#   - YaneuraOu (Linux, downloaded from GitHub)
#
# Naked-PC alternative: run the engine servers directly:
#   uv run python engines/stockfish-server.py
#   uv run python engines/go-server.py
#   uv run python engines/shogi-server.py
#
# Ports:
#   10987  — FastAPI + FastMCP gateway
#   10780  — Stockfish (Docker)
#   10781  — YaneuraOu (Docker)
#   10782  — KataGo (Docker)

services:
  games-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: games-gateway
    ports:
      - "10987:10987"
    environment:
      - GAMES_BACKEND_PORT=10987
      - STOCKFISH_URL=http://stockfish-engine:10780
      - SHOGI_URL=http://shogi-engine:10781
      - GO_URL=http://go-engine:10782
      - EDAX_URL=http://edax-engine:10785
      - GNUBG_URL=http://gnubg-engine:10786
      - OPENSPIEL_URL=http://openspiel-engine:10787
      - MOHEX_URL=http://mohex-engine:10775
      - GAMES_MCP_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10987/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      stockfish-engine:
        condition: service_started
      shogi-engine:
        condition: service_started
      go-engine:
        condition: service_started
    networks:
      - games-net

  stockfish-engine:
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: games-stockfish
    ports:
      - "10780:10780"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10780/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  shogi-engine:
    build:
      context: .
      dockerfile: Dockerfile.yaneuraou
    container_name: games-shogi
    ports:
      - "10781:10781"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10781/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  go-engine:
    build:
      context: .
      dockerfile: Dockerfile.katago
    container_name: games-go
    ports:
      - "10782:10782"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10782/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  edax-engine:
    build:
      context: .
      dockerfile: Dockerfile.edax
    container_name: games-edax
    ports:
      - "10785:10785"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10785/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - games-net

  gnubg-engine:
    build:
      context: .
      dockerfile: Dockerfile.gnubg
    container_name: games-gnubg
    ports:
      - "10786:10786"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10786/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - games-net

  openspiel-engine:
    build:
      context: .
      dockerfile: Dockerfile.openspiel
    container_name: games-openspiel
    ports:
      - "10787:10787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10787/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  mohex-engine:
    build:
      context: .
      dockerfile: Dockerfile.mohex
    container_name: games-mohex
    ports:
      - "10775:10775"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10775/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - games-net

networks:
  games-net:
    driver: bridge
