# Docker Compose for Games Collection (Hybrid Setup)
# **Timestamp**: 2025-01-27
#
# HYBRID ARCHITECTURE:
# - Linux containers: Web server + Stockfish engine (runs in Docker)
# - Windows host: KataGo and YaneuraOu (must stay outside - Windows .exe files)
#
# Stockfish runs in Docker Linux container (cross-platform compatible)
# KataGo and YaneuraOu remain on Windows host (GPU/Windows-specific)

version: '3.8'

services:
  # Web server with API proxy (Linux container)
  games-collection-web:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: games-collection-web
    ports:
      - "10726:80"        # Web interface - reserved range
      - "11001:11001"     # JLPT API Server (internal)
      - "11003:5003"      # Kanji Database API (internal)
    # No volumes: Windows Docker bind mounts cause I/O errors. All files baked into image.
    # Rebuild after code/data changes: docker compose build
    restart: unless-stopped
    networks:
      - games-network
    depends_on:
      - stockfish-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - AI_SERVER_HOST=host.docker.internal
      - DOCKER_REMOTE_ACCESS=true
      - JLPT_API_PORT=11001
      - KANJI_API_PORT=5003
    # Enable host networking for Windows Docker Desktop compatibility
    # This allows the container to access Windows host services (KataGo, YaneuraOu)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Stockfish engine (runs in Docker Linux container)
  stockfish-engine:
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-engine
    ports:
      - "10780:10780"       # Stockfish API (SOTA)
    restart: unless-stopped
    networks:
      - games-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10780/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: API proxy service for better remote connectivity
  # Uncomment if you have connectivity issues
  # api-proxy:
  #   image: nginx:alpine
  #   container_name: games-api-proxy
  #   ports:
  #     - "9543:9543"
  #     - "9544:9544"
  #     - "9545:9545"
  #     - "9877:9877"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - games-collection-web
  #   networks:
  #     - games-network
  #   restart: unless-stopped

networks:
  games-network:
    driver: bridge

