<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/theme-switcher.js"></script>
    <style>
        .direction-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .direction-row {
            display: flex;
            gap: 10px;
        }

        .direction-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .direction-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .direction-btn:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%);
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="index.html" class="back-button">← Back to Games</a>
        
        <div class="game-header">
            <h1>👻 PAC-MAN</h1>
            <div class="score" id="score">Score: 0 | Lives: 3 | Level: 1</div>
            <div class="status" id="status">Press SPACE to Start</div>
        </div>

        <div class="game-controls">
            <button onclick="startGame()">Start Game</button>
            <button onclick="pauseGame()">Pause</button>
            <button onclick="location.reload()">New Game</button>
            <a href="pacman-education.html" style="text-decoration: none;">
                <button>📚 Learn & Strategy</button>
            </a>
        </div>

        <canvas id="gameCanvas" width="560" height="620"></canvas>

        <!-- Direction Controls for Touch Devices -->
        <div class="direction-controls">
            <div class="direction-row">
                <button class="direction-btn" id="up-btn" ontouchstart="setDirection(0, -1)" onmousedown="setDirection(0, -1)" onmouseup="stopDirection()" ontouchend="stopDirection()">↑</button>
            </div>
            <div class="direction-row">
                <button class="direction-btn" id="left-btn" ontouchstart="setDirection(-1, 0)" onmousedown="setDirection(-1, 0)" onmouseup="stopDirection()" ontouchend="stopDirection()">←</button>
                <button class="direction-btn" id="down-btn" ontouchstart="setDirection(0, 1)" onmousedown="setDirection(0, 1)" onmouseup="stopDirection()" ontouchend="stopDirection()">↓</button>
                <button class="direction-btn" id="right-btn" ontouchstart="setDirection(1, 0)" onmousedown="setDirection(1, 0)" onmouseup="stopDirection()" ontouchend="stopDirection()">→</button>
            </div>
        </div>

        <div class="status">Arrow Keys or Direction Buttons to Move | SPACE to Start/Pause</div>
        
        <div class="ghost-info">
            <div class="ghost-card">🔴 Blinky - Chaser</div>
            <div class="ghost-card">🩷 Pinky - Ambusher</div>
            <div class="ghost-card">🩵 Inky - Patrol</div>
            <div class="ghost-card">🟠 Clyde - Random</div>
        </div>
    </div>

    <script src="pacman.js"></script>
</body>
</html>
