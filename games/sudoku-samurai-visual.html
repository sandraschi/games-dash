<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Sudoku - Visual Board</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme-switcher.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px #fff; }
        }

        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .board-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls-section {
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .samurai-grid {
            display: grid;
            grid-template-columns: repeat(21, 35px);
            grid-template-rows: repeat(21, 35px);
            gap: 1px;
            margin: 0 auto;
            background: #333;
            border: 4px solid #333;
            border-radius: 8px;
            padding: 2px;
            width: fit-content;
            position: relative;
        }

        .samurai-cell {
            width: 35px;
            height: 35px;
            background: white;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .samurai-cell:hover {
            background: #f0f8ff;
            transform: scale(1.05);
        }

        .samurai-cell.selected {
            background: #4CAF50 !important;
            color: white;
            box-shadow: inset 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .samurai-cell.given {
            background: #E8F5E8;
            color: #2E7D32;
            font-weight: 900;
        }

        .samurai-cell.error {
            background: #FFEBEE !important;
            color: #C62828;
            animation: shake 0.5s;
        }

        .samurai-cell.highlight {
            background: #FFF3E0;
        }

        .samurai-cell.notes {
            font-size: 10px;
            font-weight: normal;
            color: #666;
            flex-wrap: wrap;
        }

        /* Thick borders for 3x3 boxes */
        .samurai-cell:nth-child(3n) {
            border-right: 3px solid #333;
        }

        .samurai-cell:nth-child(21n+1),
        .samurai-cell:nth-child(21n+2),
        .samurai-cell:nth-child(21n+3),
        .samurai-cell:nth-child(21n+4),
        .samurai-cell:nth-child(21n+5),
        .samurai-cell:nth-child(21n+6),
        .samurai-cell:nth-child(21n+7),
        .samurai-cell:nth-child(21n+8),
        .samurai-cell:nth-child(21n+9) {
            border-bottom: 3px solid #333;
        }

        /* Invalid areas (not part of any puzzle) */
        .samurai-cell.invalid {
            background: #f5f5f5 !important;
            cursor: not-allowed;
            opacity: 0.3;
        }

        .samurai-cell.invalid::before {
            content: '×';
            color: #999;
            font-size: 12px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .btn.danger {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .number-btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s;
            color: #495057;
        }

        .number-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
            color: #667eea;
        }

        .number-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .stats h3 {
            margin: 0 0 10px 0;
            color: #495057;
        }

        .stats p {
            margin: 5px 0;
            color: #6c757d;
        }

        .mode-toggle {
            display: flex;
            margin: 15px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #dee2e6;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: #6c757d;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .game-container {
                flex-direction: column;
            }

            .controls-section {
                width: 100%;
            }

            .samurai-grid {
                grid-template-columns: repeat(21, 28px);
                grid-template-rows: repeat(21, 28px);
            }

            .samurai-cell {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            🥷 SAMURAI SUDOKU 🥷
        </div>

        <div class="game-container">
            <div class="board-section">
                <div class="samurai-grid" id="samuraiGrid">
                    <!-- Grid will be populated by JavaScript -->
                </div>
            </div>

            <div class="controls-section">
                <div class="controls">
                    <button class="btn" onclick="newGame()">🎲 New Game</button>
                    <button class="btn secondary" onclick="resetGame()">🔄 Reset</button>
                    <button class="btn" onclick="getHint()">💡 Hint</button>
                    <button class="btn success" onclick="checkSolution()">✓ Check</button>
                    <button class="btn" onclick="solveGame()">🤖 Solve</button>

                    <div class="mode-toggle">
                        <button class="mode-btn active" onclick="setMode('normal')" id="normalMode">Normal</button>
                        <button class="mode-btn" onclick="setMode('notes')" id="notesMode">Notes</button>
                    </div>

                    <div class="number-pad" id="numberPad">
                        <!-- Number buttons will be populated by JavaScript -->
                    </div>

                    <div class="stats">
                        <h3>Game Stats</h3>
                        <p id="difficulty">Difficulty: Medium</p>
                        <p id="progress">Progress: 0%</p>
                        <p id="time">Time: 00:00</p>
                        <p id="mistakes">Mistakes: 0</p>
                    </div>

                    <div id="status" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="sudoku-samurai-visual.js"></script>
</body>
</html>
