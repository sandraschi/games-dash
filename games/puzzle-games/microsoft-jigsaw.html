<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Jigsaw - Classic Image Puzzle</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <style>
        .jigsaw-ms { max-width: 600px; margin: 0 auto; padding: 20px; }
        .jigsaw-board { display: grid; gap: 2px; background: #333; padding: 8px; border-radius: 8px; margin: 20px auto; }
        .jigsaw-piece { background-size: 400% 400%; cursor: pointer; border: 1px solid #666; border-radius: 4px; transition: transform 0.1s; }
        .jigsaw-piece:hover { transform: scale(1.02); }
        .jigsaw-piece.correct { border-color: #4CAF50; opacity: 1; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); } 50% { box-shadow: 0 0 15px 5px rgba(255,215,0,0.8); } }
        .jigsaw-controls { display: flex; gap: 10px; justify-content: center; margin: 20px; flex-wrap: wrap; }
        .jigsaw-controls button { padding: 12px 24px; font-size: 16px; background: rgba(255,215,0,0.2); border: 2px solid #FFD700; border-radius: 8px; color: #FFD700; cursor: pointer; }
        .jigsaw-controls button:hover { background: rgba(255,215,0,0.4); }
        .diff-btn { padding: 8px 16px; margin: 4px; }
        .diff-btn.active { background: #FFD700; color: #000; }
    </style>
</head>
<body>
    <a href="../shared/dashboard.html" class="back-button">Back to Games</a>
    <div class="container jigsaw-ms">
        <h1>Microsoft Jigsaw</h1>
        <p>Classic 2D jigsaw puzzle. Click a piece then click where it should go to swap. Match the image!</p>
        <div class="jigsaw-controls">
            <button class="diff-btn active" data-size="4">4x4 (16)</button>
            <button class="diff-btn" data-size="6">6x6 (36)</button>
            <button class="diff-btn" data-size="8">8x8 (64)</button>
            <button id="shuffleBtn">Shuffle</button>
            <button id="hintBtn">Hint</button>
        </div>
        <div id="progress" style="text-align:center; margin:10px;">0 / 16 correct</div>
        <div id="board" class="jigsaw-board"></div>
    </div>
    <canvas id="sourceImg" width="400" height="400" style="display:none;"></canvas>
    <script src="microsoft-jigsaw.js"></script>
</body>
</html>
