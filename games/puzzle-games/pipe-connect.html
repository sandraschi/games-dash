<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Connect - Fluid Flow Edition</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/device-adaptive.js"></script>
    <script src="/js/game-sound-client.js"></script>
    <style>
        :root {
            --bg-dark: #05050a;
            --panel-bg: rgba(30, 30, 60, 0.85);
            --accent-blue: #00d2ff;
            --accent-orange: #ff6b35;
            --pipe-metallic: #8080a0;
            --pipe-stroke: #bcccdc;
            --fluid-color: #00f2ff;
            --border-glow: rgba(0, 210, 255, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-blue), #9d50bb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .level-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        #pipeGrid {
            display: grid;
            gap: 6px;
            background: #1a1a2e;
            padding: 18px;
            border-radius: 18px;
            border: 2px solid rgba(0, 210, 255, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 210, 255, 0.1);
            width: fit-content;
            margin: 20px auto;
        }

        .pipe-cell {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .pipe-cell:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }

        .pipe-cell.source {
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, transparent 70%);
            border: 1px solid var(--accent-blue);
        }

        .pipe-cell.drain {
            background: radial-gradient(circle, rgba(255, 107, 53, 0.2) 0%, transparent 70%);
            border: 1px solid var(--accent-orange);
        }

        .pipe-cell.fixed {
            border: 2px solid rgba(255, 204, 0, 0.4);
            cursor: default;
        }

        .pipe-cell.fixed::after {
            content: '🔒';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            opacity: 0.6;
        }

        .pipe-cell.worm {
            box-shadow: inset 0 0 20px #f00, 0 0 20px rgba(255, 0, 0, 0.5);
            animation: worm-pulse 1s infinite alternate;
            z-index: 10;
        }

        @keyframes worm-pulse {
            from {
                box-shadow: inset 0 0 10px #f00, 0 0 10px rgba(255, 0, 0, 0.3);
            }

            to {
                box-shadow: inset 0 0 30px #f00, 0 0 40px rgba(255, 0, 0, 0.7);
            }
        }

        .pipe-cell.worm::before {
            content: '🐛';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            z-index: 11;
            filter: drop-shadow(0 0 5px #000);
        }

        .pipe-cell.wall {
            cursor: default;
            background: rgba(40, 40, 40, 0.5);
        }

        .pipe-svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .pipe-body {
            fill: var(--pipe-metallic);
            stroke: var(--pipe-stroke);
            stroke-width: 2;
        }

        .fluid-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.8s ease-in-out;
            stroke: var(--fluid-color);
            filter: drop-shadow(0 0 8px var(--accent-blue));
        }

        .active .fluid-path {
            stroke-dashoffset: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
        }

        .status-msg {
            margin-top: 20px;
            height: 24px;
            font-weight: 600;
            color: var(--accent-blue);
        }

        /* Pipe Icons Svg templates */
        .svc-defs {
            display: none;
        }
    </style>
</head>

<body>
    <div class="game-wrapper">
        <a href="..\shared\dashboard.html" class="back-button">← Back to Games</a>

        <h1>PIPE CONNECT</h1>

        <div class="level-card">
            <div id="levelDisplay">LEVEL 1</div>
            <div id="goalDisplay">Connect the flow to the output!</div>
            <div id="wormAlert"
                style="color: #f00; font-weight: bold; font-size: 0.8em; margin-top: 5px; display: none;">⚠️ PIPEWORM
                DETECTED</div>
        </div>

        <div id="pipeGrid"></div>

        <div class="status-msg" id="status">Ready to Flow</div>

        <div class="controls">
            <button onclick="resetGame()">Reset</button>
            <button onclick="showSolution()">Show Solution</button>
            <button onclick="nextLevel()">Next level</button>
        </div>
    </div>

    <svg class="svc-defs">
        <symbol id="pipe-straight" viewBox="0 0 100 100">
            <rect x="35" y="0" width="30" height="100" class="pipe-body" />
            <path class="fluid-path" d="M 50 0 V 100" fill="none" stroke-width="14" stroke-linecap="round" />
        </symbol>
        <symbol id="pipe-corner" viewBox="0 0 100 100">
            <path d="M 50 0 Q 50 50 100 50" fill="none" class="pipe-body" style="stroke-width: 30;" />
            <path class="fluid-path" d="M 50 0 Q 50 50 100 50" fill="none" stroke-width="14" stroke-linecap="round" />
        </symbol>
        <symbol id="pipe-t" viewBox="0 0 100 100">
            <rect x="35" y="0" width="30" height="100" class="pipe-body" />
            <rect x="50" y="35" width="50" height="30" class="pipe-body" />
            <path class="fluid-path" d="M 50 0 V 100 M 50 50 H 100" fill="none" stroke-width="14"
                stroke-linecap="round" />
        </symbol>
        <symbol id="pipe-wall" viewBox="0 0 100 100">
            <rect x="15" y="15" width="70" height="70" fill="#2a2a35" stroke="#444" stroke-width="4" rx="8" />
            <path d="M 30 15 V 85 M 50 15 V 85 M 70 15 V 85" stroke="#333" stroke-width="1" />
            <path d="M 15 35 H 85 M 15 55 H 85 M 15 75 H 85" stroke="#333" stroke-width="1" />
        </symbol>
    </svg>

    <script src="pipe-connect.js"></script>
    <script>
        // Minimal bootstrap if needed, or just let pipe-connect.js handle it
    </script>
</body>

</html>
