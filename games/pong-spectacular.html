<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Spectacular Pong Demo - Arcade Games Collection</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme-switcher.js"></script>
    <style>
        :root {
            --neon-blue: #00ffff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff00;
            --neon-yellow: #ffff00;
            --neon-orange: #ff8800;
            --neon-purple: #8800ff;
            --neon-red: #ff0000;
        }

        body {
            background: linear-gradient(135deg, #0a0a0c, #1a1a2e, #16213e);
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .demo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .demo-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .demo-subtitle {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .game-canvas-container {
            position: relative;
            border: 3px solid var(--neon-blue);
            border-radius: 10px;
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            animation: borderGlow 2s ease-in-out infinite alternate;
        }

        #gameCanvas {
            display: block;
            border-radius: 7px;
            background: #000;
        }

        .demo-controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            z-index: 10;
        }

        .demo-button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: 2px solid var(--neon-blue);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .demo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(0, 255, 255, 0.5);
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
        }

        .demo-button:active {
            transform: translateY(0);
        }

        .demo-button.active {
            background: linear-gradient(45deg, var(--neon-green), var(--neon-yellow));
            border-color: var(--neon-green);
            animation: pulse 1s ease-in-out infinite;
        }

        .score-display {
            font-size: 1.5rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
            margin-top: 10px;
        }

        .status-display {
            font-size: 1.2rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            margin-top: 5px;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--neon-blue);
            font-size: 0.9rem;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }

        @keyframes borderGlow {
            from { 
                border-color: var(--neon-blue);
                box-shadow: 
                    0 0 30px rgba(0, 255, 255, 0.5),
                    inset 0 0 20px rgba(0, 255, 255, 0.1);
            }
            to { 
                border-color: var(--neon-purple);
                box-shadow: 
                    0 0 30px rgba(136, 0, 255, 0.5),
                    inset 0 0 20px rgba(136, 0, 255, 0.1);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 50%;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            50% { 
                transform: translateY(-20px) rotate(180deg);
                opacity: 1;
            }
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--neon-blue);
            border-radius: 25px;
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-link:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .demo-title {
                font-size: 2rem;
            }
            
            .demo-controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .demo-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <a href="/" class="back-link">← Back to Games</a>
        
        <div class="demo-header">
            <h1 class="demo-title">🎮 SPECTACULAR PONG</h1>
            <p class="demo-subtitle">Neon Arcade Experience - Enhanced Visual Effects</p>
        </div>

        <div class="game-canvas-container">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>

        <div class="demo-controls">
            <button class="demo-button" onclick="startGame()">🎮 Start Game</button>
            <button class="demo-button" onclick="pauseGame()">⏸️ Pause</button>
            <button class="demo-button" onclick="resetGame()">🔄 Reset</button>
            <button class="demo-button" onclick="toggleEffects()">✨ Effects</button>
        </div>

        <div class="score-display" id="score">Player: 0 | Computer: 0</div>
        <div class="status-display" id="status">Press Start to Begin</div>

        <div class="instructions">
            Use W/S or Arrow Keys to Move Paddle | SPACE to Start/Pause
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Enhanced game variables
        const paddleWidth = 15;
        const paddleHeight = 80;
        const ballRadius = 8;
        let effectsEnabled = true;
        let particles = [];

        const player = {
            x: 30,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 6,
            color: '#00ffff'
        };

        const computer = {
            x: canvas.width - 30 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 4,
            color: '#ff00ff'
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: ballRadius,
            dx: 5,
            dy: 3,
            speed: 5,
            trail: [],
            color: '#00ff00'
        };

        let gameRunning = false;
        let gamePaused = false;
        let animationId = null;

        // Enhanced drawing functions
        function drawPaddle(paddle) {
            // Draw paddle with neon glow effect
            ctx.shadowBlur = effectsEnabled ? 20 : 0;
            ctx.shadowColor = paddle.color;
            
            // Draw main paddle
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // Draw neon border
            ctx.strokeStyle = paddle.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            ctx.shadowBlur = 0;
        }

        function drawBall() {
            // Draw ball trail
            if (effectsEnabled && ball.trail.length > 0) {
                ball.trail.forEach((point, index) => {
                    ctx.globalAlpha = index / ball.trail.length * 0.5;
                    ctx.fillStyle = ball.color;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            
            // Draw ball with neon glow
            ctx.shadowBlur = effectsEnabled ? 15 : 0;
            ctx.shadowColor = ball.color;
            
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw neon ring
            ctx.strokeStyle = ball.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 3, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        function drawNet() {
            ctx.strokeStyle = effectsEnabled ? '#4444ff' : '#666';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 15]);
            
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, i);
                ctx.lineTo(canvas.width / 2, i + 15);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
        }

        function drawBackground() {
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0a0a0c');
            gradient.addColorStop(0.5, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add grid pattern
            if (effectsEnabled) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < canvas.height; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
        }

        function createParticle(x, y, color) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                color: color,
                life: 1.0
            });
        }

        function updateParticles() {
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                
                if (particle.life > 0) {
                    ctx.globalAlpha = particle.life;
                    ctx.fillStyle = particle.color;
                    ctx.fillRect(particle.x, particle.y, 4, 4);
                    ctx.globalAlpha = 1;
                    return true;
                }
                return false;
            });
        }

        function updateBall() {
            // Add to trail
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 10) {
                ball.trail.shift();
            }
            
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Ball collision with top/bottom
            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
                ball.dy = -ball.dy;
                createParticle(ball.x, ball.y, '#ffff00');
            }
            
            // Ball collision with player paddle
            if (ball.x - ball.radius <= player.x + player.width &&
                ball.x + ball.radius >= player.x &&
                ball.y >= player.y &&
                ball.y <= player.y + player.height) {
                
                ball.dx = Math.abs(ball.dx);
                ball.dy += (player.dy * 0.2); // Add spin
                ball.dy = Math.max(-8, Math.min(8, ball.dy)); // Limit speed
                
                createParticle(ball.x, ball.y, player.color);
            }
            
            // Ball collision with computer paddle
            if (ball.x + ball.radius >= computer.x &&
                ball.x - ball.radius <= computer.x + computer.width &&
                ball.y >= computer.y &&
                ball.y <= computer.y + computer.height) {
                
                ball.dx = -Math.abs(ball.dx);
                ball.dy += (computer.dy * 0.2); // Add spin
                ball.dy = Math.max(-8, Math.min(8, ball.dy)); // Limit speed
                
                createParticle(ball.x, ball.y, computer.color);
            }
            
            // Score when ball goes out of bounds
            if (ball.x < 0) {
                computer.score++;
                resetBall();
                updateScore();
            } else if (ball.x > canvas.width) {
                player.score++;
                resetBall();
                updateScore();
            }
        }

        function updatePlayer() {
            player.y += player.dy;
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        }

        function updateComputer() {
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            
            if (computerCenter < ballCenter - 20) {
                computer.dy = computer.speed;
            } else if (computerCenter > ballCenter + 20) {
                computer.dy = -computer.speed;
            } else {
                computer.dy = 0;
            }
            
            computer.y += computer.dy;
            computer.y = Math.max(0, Math.min(canvas.height - computer.height, computer.y));
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
            ball.trail = [];
        }

        function updateScore() {
            document.getElementById('score').textContent = `Player: ${player.score} | Computer: ${computer.score}`;
            
            // Check for winner
            if (player.score >= 5 || computer.score >= 5) {
                gameRunning = false;
                const winner = player.score >= 5 ? 'Player' : 'Computer';
                document.getElementById('status').textContent = `🏆 ${winner} Wins!`;
                createConfetti();
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createParticle(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height,
                        ['#ff00ff', '#00ffff', '#ffff00', '#00ff00', '#ff8800'][Math.floor(Math.random() * 5)]
                    );
                }, i * 50);
            }
        }

        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            drawBackground();
            drawNet();
            updateBall();
            updatePlayer();
            updateComputer();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();
            updateParticles();
            
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                document.getElementById('status').textContent = '🎮 Game Running - First to 5 Wins!';
                document.querySelector('.demo-button').classList.add('active');
                gameLoop();
            }
        }

        function pauseGame() {
            if (gameRunning) {
                gamePaused = !gamePaused;
                document.getElementById('status').textContent = gamePaused ? '⏸️ Game Paused' : '🎮 Game Running';
                if (!gamePaused) {
                    gameLoop();
                }
            }
        }

        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            player.score = 0;
            computer.score = 0;
            player.y = canvas.height / 2 - paddleHeight / 2;
            computer.y = canvas.height / 2 - paddleHeight / 2;
            resetBall();
            updateScore();
            document.getElementById('status').textContent = 'Press Start to Begin';
            document.querySelector('.demo-button').classList.remove('active');
            particles = [];
            
            // Draw initial state
            drawBackground();
            drawNet();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();
        }

        function toggleEffects() {
            effectsEnabled = !effectsEnabled;
            const effectsButton = event.target;
            effectsButton.textContent = effectsEnabled ? '✨ Effects' : '🎯 Simple';
            effectsButton.classList.toggle('active', effectsEnabled);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                player.dy = -player.speed;
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                player.dy = player.speed;
            } else if (e.key === ' ') {
                e.preventDefault();
                if (!gameRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || 
                e.key === 'w' || e.key === 'W' || 
                e.key === 's' || e.key === 'S') {
                player.dy = 0;
            }
        });

        // Initialize game
        resetGame();
        
        // Add floating particles
        setInterval(() => {
            if (effectsEnabled && gameRunning && Math.random() > 0.7) {
                createParticle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    '#00ffff'
                );
            }
        }, 500);
    </script>
</body>
</html>
