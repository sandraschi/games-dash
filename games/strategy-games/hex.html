<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex — MoHex AI</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { background: #0a0a0c; color: #e0e0e0; font-family: 'Outfit', 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .game-wrap { max-width: 700px; width: 100%; }
        h1 { text-align: center; color: #f59e0b; margin-bottom: 5px; font-weight: 700; letter-spacing: 0.03em; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 15px; }
        .board-wrap { position: relative; }
        canvas { display: block; margin: 0 auto; cursor: pointer; border-radius: 8px; background: #111114; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .info { text-align: center; margin-top: 10px; font-size: 15px; min-height: 24px; color: #aaa; }
        .btn { padding: 8px 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.06); color: #e0e0e0; transition: all .2s; }
        .btn:hover { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); }
        .btn.primary { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
        .btn:disabled { opacity: 0.4; cursor: default; }
        label { color: #888; font-size: 13px; }
        select { background: #1a1a1e; color: #e0e0e0; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 4px 8px; }
        .turn-indicator { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
        .turn-black { background: radial-gradient(circle at 35% 35%, #555, #111); }
        .turn-white { background: radial-gradient(circle at 35% 35%, #fff, #bbb); }
    </style>
</head>
<body>
<div class="game-wrap">
    <h1>Hex</h1>
    <div class="subtitle">Connect your sides. Black ↔ Top-Bottom · White ↔ Left-Right</div>
    <div class="board-wrap">
        <canvas id="hexCanvas" width="960" height="580"></canvas>
    </div>
    <div class="info" id="status">Your turn — place a stone</div>
    <div class="controls">
        <button class="btn" onclick="resetGame()">New Game</button>
        <button class="btn secondary" onclick="toggleAI()" id="aiBtn">Play vs AI</button>
        <label>Board:         <select id="sizeSelect" onchange="resetGame()">
            <option value="7">7×7</option>
            <option value="9">9×9</option>
            <option value="11" selected>11×11</option>
            <option value="13">13×13</option>
        </select></label>
        <label>AI: <select id="aiLevel" onchange="resetGame()">
            <option value="1">Fast</option>
            <option value="2">Medium</option>
            <option value="3" selected>Strong</option>
            <option value="4">Expert</option>
            <option value="5">Brutal</option>
        </select></label>
        <button class="btn" onclick="toggleAIVsAI()" id="aivsaiBtn">AI vs AI</button>
        <a href="hex-education.html" class="btn" style="text-decoration:none; line-height:2.5;">Learn</a>
    </div>
</div>
<script src="/games/strategy-games/hex.js"></script>
</body>
</html>
