<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Connect - Fluid Flow Edition</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/device-adaptive.js"></script>
    <script src="/js/game-sound-client.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --panel-bg: rgba(26, 26, 46, 0.8);
            --accent-blue: #00d2ff;
            --accent-orange: #ff6b35;
            --pipe-metallic: #505070;
            --fluid-color: #00d2ff;
            --border-glow: rgba(0, 210, 255, 0.3);
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-blue), #9d50bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .level-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        #pipeGrid {
            display: grid;
            gap: 4px;
            background: #11111d;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            width: fit-content;
            margin: 20px auto;
        }

        .pipe-cell {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .pipe-cell:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .pipe-cell.source {
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, transparent 70%);
            border: 1px solid var(--accent-blue);
        }

        .pipe-cell.drain {
            background: radial-gradient(circle, rgba(255, 107, 53, 0.2) 0%, transparent 70%);
            border: 1px solid var(--accent-orange);
        }

        .pipe-svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .fluid-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.8s ease-in-out;
            stroke: var(--fluid-color);
            filter: drop-shadow(0 0 5px var(--accent-blue));
        }

        .active .fluid-path {
            stroke-dashoffset: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
        }

        .status-msg {
            margin-top: 20px;
            height: 24px;
            font-weight: 600;
            color: var(--accent-blue);
        }

        /* Pipe Icons Svg templates */
        .svc-defs { display: none; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <a href="/" class="back-button" style="align-self: flex-start;">← HOME</a>
        
        <h1>PIPE CONNECT</h1>
        
        <div class="level-card">
            <div id="levelDisplay">LEVEL 1</div>
            <div id="goalDisplay">Connect the flow to the output!</div>
        </div>

        <div id="pipeGrid"></div>

        <div class="status-msg" id="status">Ready to Flow</div>

        <div class="controls">
            <button onclick="resetGame()">Reset</button>
            <button onclick="nextLevel()">Next level</button>
        </div>
    </div>

    <svg class="svc-defs">
        <symbol id="pipe-straight" viewBox="0 0 100 100">
            <rect x="35" y="0" width="30" height="100" fill="#2c2c3a" />
            <path class="fluid-path" d="M 50 0 V 100" fill="none" stroke-width="12" stroke-linecap="round" />
        </symbol>
        <symbol id="pipe-corner" viewBox="0 0 100 100">
            <path d="M 50 0 Q 50 50 100 50" fill="none" stroke="#2c2c3a" stroke-width="30" />
            <path class="fluid-path" d="M 50 0 Q 50 50 100 50" fill="none" stroke-width="12" stroke-linecap="round" />
        </symbol>
        <symbol id="pipe-t" viewBox="0 0 100 100">
            <rect x="35" y="0" width="30" height="100" fill="#2c2c3a" />
            <rect x="50" y="35" width="50" height="30" fill="#2c2c3a" />
            <path class="fluid-path" d="M 50 0 V 100 M 50 50 H 100" fill="none" stroke-width="12" stroke-linecap="round" />
        </symbol>
    </svg>

    <script>
        const TYPES = {
            STRAIGHT: 'straight',
            CORNER: 'corner',
            T: 't',
            EMPTY: 'empty'
        };

        const LEVELS = [
            {
                size: 5,
                source: {x: 0, y: 2, dir: 'right'},
                drain: {x: 4, y: 2, dir: 'left'},
                pipes: [
                    'S', 'C', 'C', 'C', 'C',
                    'C', 'C', 'C', 'C', 'C',
                    'C', 'C', 'C', 'C', 'C',
                    'C', 'C', 'C', 'C', 'C',
                    'C', 'C', 'C', 'C', 'C'
                ]
            }
        ];

        let currentLevelIndex = 0;
        let grid = [];
        let state = [];

        function initLevel(index) {
            const level = LEVELS[index];
            const gridEl = document.getElementById('pipeGrid');
            gridEl.style.gridTemplateColumns = `repeat(${level.size}, 70px)`;
            gridEl.innerHTML = '';
            
            state = [];
            for (let y = 0; y < level.size; y++) {
                for (let x = 0; x < level.size; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'pipe-cell';
                    
                    const isSource = level.source.x === x && level.source.y === y;
                    const isDrain = level.drain.x === x && level.drain.y === y;
                    
                    if (isSource) cell.classList.add('source');
                    if (isDrain) cell.classList.add('drain');

                    const type = isSource || isDrain ? TYPES.STRAIGHT : (Math.random() > 0.5 ? TYPES.STRAIGHT : TYPES.CORNER);
                    const rotation = Math.floor(Math.random() * 4) * 90;
                    
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", "pipe-svg");
                    svg.style.transform = `rotate(${rotation}deg)`;
                    
                    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
                    use.setAttributeNS("http://www.w3.org/1999/xlink", "href", `#pipe-${type}`);
                    svg.appendChild(use);
                    cell.appendChild(svg);
                    
                    const pipeData = { x, y, type, rotation, active: false, cell, isSource, isDrain };
                    state.push(pipeData);
                    
                    cell.onclick = () => rotatePipe(pipeData);
                    gridEl.appendChild(cell);
                }
            }
            updateFlow();
        }

        function rotatePipe(pipe) {
            if (pipe.isSource || pipe.isDrain) return;
            pipe.rotation = (pipe.rotation + 90) % 360;
            pipe.cell.querySelector('svg').style.transform = `rotate(${pipe.rotation}deg)`;
            
            if (window.gameSound) window.gameSound.playSound('click');
            updateFlow();
        }

        function getConnections(pipe) {
            const r = pipe.rotation;
            if (pipe.type === TYPES.STRAIGHT) {
                return r === 0 || r === 180 ? ['up', 'down'] : ['left', 'right'];
            }
            if (pipe.type === TYPES.CORNER) {
                if (r === 0) return ['up', 'right'];
                if (r === 90) return ['right', 'down'];
                if (r === 180) return ['down', 'left'];
                if (r === 270) return ['left', 'up'];
            }
            return [];
        }

        function updateFlow() {
            state.forEach(p => {
                p.active = false;
                p.cell.classList.remove('active');
            });

            const level = LEVELS[currentLevelIndex];
            const sourcePipe = state.find(p => p.x === level.source.x && p.y === level.source.y);
            
            const queue = [sourcePipe];
            const visited = new Set();
            
            while(queue.length > 0) {
                const p = queue.shift();
                const key = `${p.x},${p.y}`;
                if (visited.has(key)) continue;
                visited.add(key);
                
                p.active = true;
                p.cell.classList.add('active');
                
                if (p.isDrain) {
                    handleWin();
                }

                const conns = getConnections(p);
                conns.forEach(dir => {
                    let nx = p.x, ny = p.y;
                    let opp = '';
                    if (dir === 'up') { ny--; opp = 'down'; }
                    if (dir === 'down') { ny++; opp = 'up'; }
                    if (dir === 'left') { nx--; opp = 'right'; }
                    if (dir === 'right') { nx++; opp = 'left'; }
                    
                    const next = state.find(p2 => p2.x === nx && p2.y === ny);
                    if (next && getConnections(next).includes(opp)) {
                        queue.push(next);
                    }
                });
            }
        }

        function handleWin() {
            document.getElementById('status').textContent = "💧 FLOW RESTORED! 💧";
            if (window.gameSound) window.gameSound.playSound('win');
        }

        function resetGame() {
            initLevel(currentLevelIndex);
        }

        function nextLevel() {
            alert("More levels coming soon!");
        }

        document.addEventListener('DOMContentLoaded', () => initLevel(0));
    </script>
</body>
</html>
