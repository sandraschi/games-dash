<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Labyrinth - Maze Game</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        [data-theme="garden"] {
            --accent-color: #76ff03;
            --wall-color: #1b3a1a;
            --wall-glow: #2e7d32;
            --player-color: #ffeb3b;
            --exit-color: #f48fb1;
            --gold-color: #ffd700;
        }

        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(20, 20, 40, 0.7);
            --accent-color: #00f2ff;
            --wall-color: #1a1a3a;
            --wall-glow: #0044ff;
            --player-color: #ff0055;
            --exit-color: #00ff88;
            --wolf-color: #ffcc00;
            --gold-color: #ffcc00;
            --text-color: #e0e0f0;
            --garden-wall: #2d5a27;
            --garden-glow: #4e9a44;
            --danger-color: #ff3300;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel-bg);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        .stat-item span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .stat-item.pressure span {
            color: var(--danger-color);
            text-shadow: 0 0 10px var(--danger-color);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .game-area {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            border: 2px solid var(--wall-color);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            max-height: calc(100vh - 250px);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        button {
            padding: 12px 24px;
            background: var(--panel-bg);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 15px var(--accent-color);
            transform: translateY(-2px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
            backdrop-filter: blur(5px);
        }

        .overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .overlay p {
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .game-info {
            font-size: 0.8rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body data-theme="midnight">
    <div class="container">
        <header>
            <h1>MIDNIGHT LABYRINTH</h1>
            <div class="stats">
                <div class="stat-item">LV: <span id="level-val">1</span></div>
                <div class="stat-item">GOLD: <span id="gold-val">0</span></div>
                <div class="stat-item">TIME: <span id="timer-val">--</span></div>
                <div class="stat-item">MODE: <span id="mode-val">Classic</span></div>
            </div>
        </header>

        <div class="game-area">
            <canvas id="mazeCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="resetLevel()">Reset Level</button>
            <button onclick="regenerateMaze()">Regenerate</button>
            <button onclick="toggleTheme()">Switch Theme</button>
        </div>

        <div class="game-info">
            Use ARROW KEYS or WASD to navigate. Reach the green exit. Watch out for the golden wolf!
        </div>
    </div>

    <div id="win-overlay" class="overlay">
        <h2 id="overlay-title">LEVEL COMPLETE</h2>
        <p id="overlay-desc">You escaped the labyrinth!</p>
        <button onclick="nextLevel()">Next Level</button>
    </div>

    <div id="gameover-overlay" class="overlay">
        <h2 id="death-title">CAUGHT!</h2>
        <p id="death-desc">The wolf found you in the dark...</p>
        <button onclick="resetLevel()">Retry Level</button>
    </div>

    <script src="../js/api-config.js"></script>
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const levelText = document.getElementById('level-val');
        const goldText = document.getElementById('gold-val');
        const timerText = document.getElementById('timer-val');
        const modeText = document.getElementById('mode-val');
        const winOverlay = document.getElementById('win-overlay');
        const gameOverOverlay = document.getElementById('gameover-overlay');

        let mazeWidth = 15;
        let mazeHeight = 15;
        let cellSize = 30;
        let grid = [];
        let player = { x: 0, y: 0 };
        let exit = { x: 0, y: 0 };
        let wolf = { x: -1, y: -1, active: false };
        let goldPots = [];
        let level = 1;
        let moves = 0;
        let goldCollected = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let currentTheme = 'midnight';
        let currentMode = 'Classic';

        const LEVELS = [
            { w: 11, h: 11, mode: 'Classic', theme: 'midnight', wolf: false, time: 60 },
            { w: 15, h: 15, mode: 'Classic', theme: 'midnight', wolf: false, time: 90 },
            { w: 15, h: 15, mode: 'Center', theme: 'midnight', wolf: false, time: 90 },
            { w: 19, h: 19, mode: 'Islands', theme: 'garden', wolf: false, time: 120 },
            { w: 21, h: 21, mode: 'Classic', theme: 'midnight', wolf: true, wolfSpeed: 2, time: 150 },
            { w: 25, h: 25, mode: 'Center', theme: 'garden', wolf: true, wolfSpeed: 2, time: 180 },
            { w: 29, h: 29, mode: 'Islands', theme: 'midnight', wolf: true, wolfSpeed: 1, time: 240 }
        ];

        function getLevelConfig(lv) {
            if (lv <= LEVELS.length) return LEVELS[lv - 1];
            return {
                w: 29 + Math.floor((lv - 7) / 2) * 4,
                h: 29 + Math.floor((lv - 7) / 2) * 4,
                mode: lv % 3 === 0 ? 'Center' : (lv % 3 === 1 ? 'Classic' : 'Islands'),
                theme: lv % 2 === 0 ? 'garden' : 'midnight',
                wolf: true,
                wolfSpeed: lv > 15 ? 1 : 2,
                time: 300 + (lv - 7) * 20
            };
        }

        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.walls = [true, true, true, true]; // top, right, bottom, left
                this.visited = false;
            }
        }

        function generateMaze(w, h, mode) {
            grid = [];
            for (let y = 0; y < h; y++) {
                let row = [];
                for (let x = 0; x < w; x++) {
                    row.push(new Cell(x, y));
                }
                grid.push(row);
            }

            const stack = [];
            let current = grid[0][0];
            current.visited = true;

            while (true) {
                let next = getUnvisitedNeighbor(current);
                if (next) {
                    next.visited = true;
                    stack.push(current);
                    removeWalls(current, next);
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }

            if (mode === 'Islands') {
                // Remove extra walls to create cycles (and unreachable-to-perimeter loops)
                for (let i = 0; i < (w * h) / 10; i++) {
                    let rx = Math.floor(Math.random() * (w - 2)) + 1;
                    let ry = Math.floor(Math.random() * (h - 2)) + 1;
                    let dir = Math.floor(Math.random() * 4);
                    let c1 = grid[ry][rx];
                    let c2 = dir === 0 ? grid[ry - 1][rx] : dir === 1 ? grid[ry][rx + 1] : dir === 2 ? grid[ry + 1][rx] : grid[ry][rx - 1];
                    removeWalls(c1, c2);
                }
            }

            // Set exit
            if (mode === 'Center') {
                exit = { x: Math.floor(w / 2), y: Math.floor(h / 2) };
            } else {
                exit = { x: w - 1, y: h - 1 };
            }

            // Identify cul-de-sacs for Pots of Gold
            goldPots = [];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const cell = grid[y][x];
                    const walls = cell.walls.filter(w => w).length;
                    // Dead end has 3 walls
                    if (walls === 3 && !(x === 0 && y === 0) && !(x === exit.x && y === exit.y)) {
                        goldPots.push({ x, y });
                    }
                }
            }

            player = { x: 0, y: 0 };
        }

        function getUnvisitedNeighbor(cell) {
            let neighbors = [];
            let { x, y } = cell;

            if (y > 0 && !grid[y - 1][x].visited) neighbors.push(grid[y - 1][x]);
            if (x < grid[0].length - 1 && !grid[y][x + 1].visited) neighbors.push(grid[y][x + 1]);
            if (y < grid.length - 1 && !grid[y + 1][x].visited) neighbors.push(grid[y + 1][x]);
            if (x > 0 && !grid[y][x - 1].visited) neighbors.push(grid[y][x - 1]);

            if (neighbors.length > 0) {
                return neighbors[Math.floor(Math.random() * neighbors.length)];
            }
            return null;
        }

        function removeWalls(a, b) {
            let dx = a.x - b.x;
            if (dx === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (dx === -1) { a.walls[1] = false; b.walls[3] = false; }

            let dy = a.y - b.y;
            if (dy === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (dy === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Wall colors from CSS
            const style = getComputedStyle(document.body);
            const wallColor = style.getPropertyValue('--wall-color').trim();
            const wallGlow = style.getPropertyValue('--wall-glow').trim();
            const accent = style.getPropertyValue('--accent-color').trim();
            const isGarden = document.body.getAttribute('data-theme') === 'garden';

            ctx.strokeStyle = wallColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 4;
            ctx.shadowColor = wallGlow;

            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    let cell = grid[y][x];
                    let px = x * cellSize;
                    let py = y * cellSize;

                    if (isGarden) {
                        drawBushyWalls(x, y, cell);
                    } else {
                        ctx.beginPath();
                        if (cell.walls[0]) { ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); }
                        if (cell.walls[1]) { ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); }
                        if (cell.walls[2]) { ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); }
                        if (cell.walls[3]) { ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); }
                        ctx.stroke();
                    }
                }
            }

            // Exit
            ctx.shadowBlur = 15;
            ctx.shadowColor = style.getPropertyValue('--exit-color').trim();
            ctx.fillStyle = ctx.shadowColor;

            if (isGarden) {
                // Flower shape for exit in garden
                const cx = exit.x * cellSize + cellSize / 2;
                const cy = exit.y * cellSize + cellSize / 2;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(i * Math.PI * 0.4) * 5, cy + Math.sin(i * Math.PI * 0.4) * 5, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(exit.x * cellSize + cellSize / 2, exit.y * cellSize + cellSize / 2, cellSize / 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Player
            ctx.shadowBlur = 20;
            ctx.shadowColor = style.getPropertyValue('--player-color').trim();
            ctx.fillStyle = ctx.shadowColor;
            ctx.beginPath();
            ctx.arc(player.x * cellSize + cellSize / 2, player.y * cellSize + cellSize / 2, cellSize / 3, 0, Math.PI * 2);
            ctx.fill();

            // Gold Pots
            ctx.shadowBlur = 10;
            ctx.shadowColor = style.getPropertyValue('--gold-color').trim();
            ctx.fillStyle = ctx.shadowColor;
            for (const pot of goldPots) {
                const cx = pot.x * cellSize + cellSize / 2;
                const cy = pot.y * cellSize + cellSize / 2;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize / 6, 0, Math.PI * 2);
                ctx.fill();
                // Pot shine
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(cx - 2, cy - 2, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = ctx.shadowColor;
            }

            // Wolf
            if (wolf.active) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = style.getPropertyValue('--wolf-color').trim();
                ctx.fillStyle = ctx.shadowColor;
                ctx.beginPath();
                ctx.moveTo(wolf.x * cellSize + cellSize / 2, wolf.y * cellSize + cellSize / 4);
                ctx.lineTo(wolf.x * cellSize + cellSize / 4, wolf.y * cellSize + cellSize * 0.75);
                ctx.lineTo(wolf.x * cellSize + cellSize * 0.75, wolf.y * cellSize + cellSize * 0.75);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawBushyWalls(x, y, cell) {
            const px = x * cellSize;
            const py = y * cellSize;
            const style = getComputedStyle(document.body);
            const wallColor = style.getPropertyValue('--wall-color').trim();

            ctx.fillStyle = wallColor;
            ctx.shadowBlur = 1; // Brighter highlights for leaves

            const drawBushLine = (x1, y1, x2, y2) => {
                const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                const steps = Math.floor(dist / 3); // More clusters
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const bx = x1 + (x2 - x1) * t;
                    const by = y1 + (y2 - y1) * t;
                    ctx.beginPath();
                    // Randomized leaf blobs
                    ctx.arc(bx + (Math.random() - 0.5) * 4, by + (Math.random() - 0.5) * 4, 4 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            };

            if (cell.walls[0]) drawBushLine(px, py, px + cellSize, py);
            if (cell.walls[1]) drawBushLine(px + cellSize, py, px + cellSize, py + cellSize);
            if (cell.walls[2]) drawBushLine(px + cellSize, py + cellSize, px, py + cellSize);
            if (cell.walls[3]) drawBushLine(px, py + cellSize, px, py);
        }

        function movePlayer(dx, dy) {
            let currentCell = grid[player.y][player.x];
            let canMove = false;

            if (dx === 1 && !currentCell.walls[1]) canMove = true;
            if (dx === -1 && !currentCell.walls[3]) canMove = true;
            if (dy === 1 && !currentCell.walls[2]) canMove = true;
            if (dy === -1 && !currentCell.walls[0]) canMove = true;

            if (canMove) {
                player.x += dx;
                player.y += dy;
                moves++;

                // Collect gold
                const goldIndex = goldPots.findIndex(p => p.x === player.x && p.y === player.y);
                if (goldIndex !== -1) {
                    goldPots.splice(goldIndex, 1);
                    goldCollected += 50;
                    goldText.innerText = goldCollected;
                    if (window.gameSound) gameSound.playSound('collect');
                }

                if (wolf.active && moves % getLevelConfig(level).wolfSpeed === 0) {
                    moveWolf();
                }

                draw();
                checkWin();
            }
        }

        function moveWolf() {
            // BFS to find path to player
            const path = findPath(wolf.x, wolf.y, player.x, player.y);
            if (path && path.length > 1) {
                wolf.x = path[1].x;
                wolf.y = path[1].y;
            }

            if (wolf.x === player.x && wolf.y === player.y) {
                showGameOver("CAUGHT!", "The wolf found you in the dark...");
            }
        }

        function findPath(sx, sy, tx, ty) {
            const queue = [[{ x: sx, y: sy }]];
            const visited = new Set();
            visited.add(`${sx},${sy}`);

            while (queue.length > 0) {
                const path = queue.shift();
                const cell = path[path.length - 1];

                if (cell.x === tx && cell.y === ty) return path;

                const currentCell = grid[cell.y][cell.x];
                const neighbors = [];
                if (!currentCell.walls[0]) neighbors.push({ x: cell.x, y: cell.y - 1 });
                if (!currentCell.walls[1]) neighbors.push({ x: cell.x + 1, y: cell.y });
                if (!currentCell.walls[2]) neighbors.push({ x: cell.x, y: cell.y + 1 });
                if (!currentCell.walls[3]) neighbors.push({ x: cell.x - 1, y: cell.y });

                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push([...path, n]);
                    }
                }
            }
            return null;
        }

        function checkWin() {
            if (player.x === exit.x && player.y === exit.y) {
                clearInterval(timerInterval);
                winOverlay.style.display = 'flex';
                if (window.gameSound) gameSound.playSound('win');
            }
        }

        function showGameOver(title, desc) {
            clearInterval(timerInterval);
            document.getElementById('death-title').innerText = title;
            document.getElementById('death-desc').innerText = desc;
            gameOverOverlay.style.display = 'flex';
            if (window.gameSound) gameSound.playSound('die');
        }

        function startTimer(limit) {
            if (timerInterval) clearInterval(timerInterval);
            if (!limit) {
                timerText.innerText = '--';
                return;
            }
            timeLeft = limit;
            timerText.innerText = timeLeft;
            timerText.parentElement.classList.remove('pressure');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                if (timeLeft <= 10) timerText.parentElement.classList.add('pressure');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showGameOver("TIMEOUT!", "Time ran out in the labyrinth...");
                }
            }, 1000);
        }

        function initLevel() {
            const config = getLevelConfig(level);
            currentMode = config.mode;
            mazeWidth = config.w;
            mazeHeight = config.h;
            cellSize = Math.min(600 / mazeWidth, 600 / mazeHeight);

            canvas.width = mazeWidth * cellSize;
            canvas.height = mazeHeight * cellSize;

            document.body.setAttribute('data-theme', config.theme);
            currentTheme = config.theme;
            modeText.innerText = config.mode;

            generateMaze(mazeWidth, mazeHeight, config.mode);

            if (config.wolf) {
                wolf.active = true;
                wolf.x = exit.x;
                wolf.y = exit.y;
            } else {
                wolf.active = false;
            }

            moves = 0;
            levelText.innerText = level;
            winOverlay.style.display = 'none';
            gameOverOverlay.style.display = 'none';

            startTimer(config.time);
            draw();
        }

        function nextLevel() {
            level++;
            initLevel();
        }

        function resetLevel() {
            initLevel();
        }

        function regenerateMaze() {
            generateMaze(mazeWidth, mazeHeight, currentMode);
            if (wolf.active) { wolf.x = exit.x; wolf.y = exit.y; }
            draw();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'midnight' ? 'garden' : 'midnight';
            document.body.setAttribute('data-theme', currentTheme);
            draw();
        }

        window.addEventListener('keydown', (e) => {
            if (winOverlay.style.display === 'flex' || gameOverOverlay.style.display === 'flex') return;

            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': movePlayer(0, -1); break;
                case 'ArrowDown': case 's': case 'S': movePlayer(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': movePlayer(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0); break;
            }
        });

        // Start game
        initLevel();
    </script>
</body>

</html>
