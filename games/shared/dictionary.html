<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jpen - Dictionary</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script> <!-- Reusing existing styles -->
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>

    <style>
        /* Specific overrides for dictionary */
        .dict-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-bar-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
        }

        .vocab-card {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.2s ease;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            background: rgba(40, 40, 40, 0.8);
            border-color: rgba(100, 200, 255, 0.2);
        }

        .vocab-expression {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 2rem;
            color: #ffd700;
            font-weight: 700;
            min-width: 150px;
        }

        .vocab-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .vocab-reading {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .vocab-translation {
            color: white;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .vocab-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .vocab-tag {
            background: rgba(100, 200, 255, 0.1);
            color: #64c8ff;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }

        .fav-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fav-btn:hover {
            color: #ffd700;
            transform: scale(1.1);
        }

        .fav-btn.active {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(100, 200, 255, 0.2);
            border-color: rgba(100, 200, 255, 0.3);
        }

        .page-btn.active {
            background: #64c8ff;
            color: black;
            font-weight: 600;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Examples Section */
        .examples-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            /* Hidden by default */
        }

        .examples-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .example-item {
            margin-bottom: 0.8rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .example-jp {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 0.2rem;
        }

        .example-en {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .example-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
        }

        .example-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .search-select-150 {
            flex: 0 0 150px;
        }

        .search-select-160 {
            flex: 0 0 160px;
        }

        .results-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 2rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <a href="../japan/kanji-table.html" class="nav-item">
            <i class="fas fa-th"></i> Kanji Table
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-book"></i> Dictionary
        </a>
        <a href="../educational/vocabulary.html" class="nav-item">
            <i class="fas fa-star"></i> My Words
        </a>
    </div>

    <div class="dict-container">
        <h1><i class="fas fa-book-open"></i> Japanese Dictionary</h1>

        <div class="search-bar-container">
            <input type="text" id="searchInput" class="search-input" title="Search dictionary"
                placeholder="Search usage (English, Romaji, or Japanese)...">
            <select id="tagWaitlist" class="search-input search-select-150" title="Filter by JLPT level or category">
                <option value="">All Categories</option>
                <option value="jl1">JLPT N1</option>
                <option value="jl2">JLPT N2</option>
                <option value="jl3">JLPT N3</option>
                <option value="jl4">JLPT N4</option>
                <option value="common">Common</option>
            </select>
            <select id="sourceSelect" class="search-input search-select-160" title="Select word source">
                <option value="all">All Sources</option>
                <option value="mine">My Words</option>
                <option value="official">Official Dict</option>
            </select>
        </div>

        <div id="resultsContainer">
            <!-- Results injected here -->
            <div class="results-placeholder">
                Enter a search term to begin...
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script src="dictionary.js"></script>
</body>

</html>
