<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Jenga - Physics Block Tower Game</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme-switcher.js"></script>
    <!-- Three.js and Cannon.js for 3D physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js?v=20241227"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js?v=20241227"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js?v=20241227"></script>
    <style>
        :root {
            --jenga-gold: #f59e0b;
            --jenga-bg: #0a0a0c;
            --jenga-panel: rgba(20, 20, 25, 0.85);
        }

        body {
            background: var(--jenga-bg);
            color: #e0e0e0;
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--jenga-panel);
            padding: 10px 20px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.2);
            gap: 15px;
            flex-shrink: 0;
        }

        .top-bar h1 {
            margin: 0;
            color: var(--jenga-gold);
            font-size: 1.4em;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .top-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85em;
        }

        .top-stats span {
            color: #aaa;
        }

        .top-stats strong {
            color: #fff;
        }

        .top-stats .status {
            color: var(--jenga-gold);
            font-weight: 600;
        }

        .game-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #jenga3DContainer {
            flex: 1;
            position: relative;
            cursor: grab;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            border-radius: 0;
            overflow: hidden;
        }

        #jenga3DContainer:active { cursor: grabbing; }
        #jenga3DContainer canvas { display: block; background: transparent; }

        .camera-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 200;
        }

        .camera-btn {
            padding: 4px 10px;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75em;
            transition: all 0.2s;
        }

        .camera-btn:hover {
            background: rgba(0,0,0,0.9);
            color: var(--jenga-gold);
            border-color: var(--jenga-gold);
        }

        .side-panel {
            width: 380px;
            background: var(--jenga-panel);
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            gap: 10px;
            overflow-y: auto;
            border-left: 1px solid rgba(245, 158, 11, 0.15);
            flex-shrink: 0;
        }

        .panel-section {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .panel-section h3 {
            margin: 0 0 8px 0;
            color: var(--jenga-gold);
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .variety-buttons {
            display: flex;
            gap: 6px;
        }

        .variety-btn {
            flex: 1;
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .variety-btn:hover {
            background: rgba(245, 158, 11, 0.15);
        }

        .variety-btn.active {
            background: rgba(245, 158, 11, 0.2);
            color: var(--jenga-gold);
            border-color: var(--jenga-gold);
        }

        .theme-select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background: #1a1a1e;
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8em;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 100px;
        }

        .btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.06);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 0.82em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .btn.primary {
            background: rgba(245, 158, 11, 0.15);
            color: var(--jenga-gold);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .btn.primary:hover {
            background: rgba(245, 158, 11, 0.25);
        }

        .btn.danger {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .friction-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .friction-row input[type=range] {
            flex: 1;
            accent-color: var(--jenga-gold);
        }

        .friction-row .value {
            color: var(--jenga-gold);
            font-weight: 600;
            font-size: 0.85em;
            min-width: 50px;
            text-align: right;
        }

        .crash-overlay {
            position: absolute;
            inset: 0;
            background: rgba(239, 68, 68, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        .crash-overlay.show {
            opacity: 1;
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            min-width: 320px;
            max-width: 440px;
            text-align: center;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .instructions h2 { color: var(--jenga-gold); margin: 0; font-size: 1.2em; }
        .instructions p { margin: 0; line-height: 1.4; font-size: 0.85em; color: #bbb; }
        .instructions.hidden { display: none; }

        @media (max-width: 900px) {
            .game-content { flex-direction: column; }
            #jenga3DContainer { height: 55vh; }
            .side-panel { width: auto; max-height: 45vh; border-left: none; border-top: 1px solid rgba(245, 158, 11, 0.15); }
            .top-bar { flex-wrap: wrap; }
            .top-bar h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <h1>3D Jenga</h1>
            <div class="top-stats">
                <span>Level <strong id="level">1</strong></span>
                <span>Removed <strong id="blocks-removed">0</strong></span>
                <span>Stability <strong id="stability">100%</strong></span>
                <span class="status" id="status">Select a block</span>
            </div>
        </div>

        <div class="game-content">
            <div id="jenga3DContainer">
                <div class="crash-overlay" id="crash-overlay">
                    CRASH!
                </div>

                <div class="camera-controls">
                    <button class="camera-btn" onclick="setCameraAngle('top')">Top</button>
                    <button class="camera-btn" onclick="setCameraAngle('side')">Side</button>
                    <button class="camera-btn" onclick="setCameraAngle('iso')">Iso</button>
                    <button class="camera-btn" onclick="resetCamera()">Reset</button>
                </div>

                <div class="instructions" id="instructions">
                    <h2>How to Play</h2>
                    <p>Click a block to select it, then click <strong>Pull Block</strong> to remove it.</p>
                    <p>Stack the removed block on top. Don't let the tower fall!</p>
                    <button class="btn primary" onclick="this.parentElement.classList.add('hidden')">Let's Play!</button>
                </div>
            </div>

            <div class="side-panel">
                <div class="panel-section">
                    <h3>Variety</h3>
                    <div class="variety-buttons">
                        <button class="variety-btn active" onclick="setJengaVariant('classic')">3-Brick</button>
                        <button class="variety-btn" onclick="setJengaVariant('jenga4')">4-Brick</button>
                        <button class="variety-btn" onclick="setJengaVariant('jenga5')">5-Brick</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Theme</h3>
                    <select class="theme-select" id="themeSelector" onchange="setJengaTheme(this.value)">
                        <option value="classic">Blocks</option>
                        <option value="dachshund">Dachshund Dogs</option>
                        <option value="sausage">German Sausages</option>
                        <option value="battery">AA Batteries</option>
                        <option value="random">Random Mix</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h3>Friction</h3>
                    <div class="friction-row">
                        <input type="range" id="frictionSlider" min="0" max="2" step="0.1" value="0.4"
                               onchange="setFriction(this.value)" oninput="updateFrictionDisplay(this.value)">
                        <span class="value" id="frictionDisplay">Med</span>
                    </div>
                </div>

                <div class="panel-section" style="flex:1;">
                    <h3>Actions</h3>
                    <div class="btn-group">
                        <button class="btn primary" id="pull-btn" onclick="pullBlock()" disabled>Pull Block</button>
                        <button class="btn" onclick="resetTower()">Reset</button>
                        <button class="btn" onclick="newGame()">New Game</button>
                        <button class="btn" id="aiToggle" onclick="toggleAI()">vs AI</button>
                        <a href="jenga-education.html" style="flex:1; text-decoration:none;"><button class="btn" style="width:100%;">Learn</button></a>
                        <a href="/" style="flex:1; text-decoration:none;"><button class="btn danger" style="width:100%;">Back</button></a>
                    </div>
                    <div id="aiControls" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.06);">
                        <h3 style="margin:0 0 6px 0; color:var(--jenga-gold); font-size:0.75em; text-transform:uppercase;">AI</h3>
                        <select class="theme-select" id="aiPersonality" onchange="setAIPersonality()" style="margin-bottom:6px;">
                            <option value="strategic">Strategic</option>
                            <option value="conservative">Conservative</option>
                            <option value="aggressive">Aggressive</option>
                            <option value="wicked">Wicked</option>
                            <option value="naive">Naive</option>
                            <option value="random">Random</option>
                        </select>
                        <span id="aiThinking" style="display:none; color:var(--jenga-gold); font-size:0.8em;">AI thinking...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="strategy-games/jenga.js"></script>
</body>
</html>
