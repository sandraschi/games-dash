<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Server Control Center</title>
    <link rel="stylesheet" href="/styles.css" media="all">
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/device-adaptive.js"></script>
    <script src="/js/game-sound-client.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-green: #00ff88;
            --neon-red: #ff4444;
            --neon-blue: #00d2ff;
            --neon-orange: #ff9900;
            --bg-color: #0f172a;
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .glass-header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
        }

        .system-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .global-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .server-card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .server-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .server-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #475569;
            transition: background 0.3s;
        }

        .server-card.running::before {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .server-card.stopped::before {
            background: var(--neon-red);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .server-name {
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
        }

        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .running .status-led {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            animation: pulse 2s infinite;
        }

        .stopped .status-led {
            background: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 2px;
        }

        .stat-value {
            color: #e2e8f0;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-restart {
            color: var(--neon-orange);
            border-color: rgba(255, 153, 0, 0.2);
        }

        .btn-start {
            color: var(--neon-green);
            border-color: rgba(0, 255, 136, 0.2);
        }

        .btn-stop {
            color: var(--neon-red);
            border-color: rgba(255, 68, 68, 0.2);
        }

        .btn-primary {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
        }

        .btn-primary:hover:not(:disabled) {
            background: #fff;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 16px 24px;
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 10px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .server-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← DASHBOARD</a>

        <header class="glass-header">
            <div class="system-meta">System Orchestration Layer</div>
            <h1>Control Center</h1>
            <p style="color: #94a3b8; margin: 15px 0;">Real-time management for games app infrastructure.</p>

            <div class="global-actions">
                <button class="btn btn-primary" onclick="app.refresh()">🔄 SYNC STATES</button>
                <button class="btn btn-restart" onclick="app.controlAll('restart')">Restart All</button>
                <button class="btn btn-start" onclick="app.controlAll('start')">Power On All</button>
                <button class="btn btn-stop" onclick="app.controlAll('stop')">Safe Shutdown All</button>
            </div>
        </header>

        <div id="serverGrid" class="server-grid">
            <!-- Dynamic Injection -->
        </div>

        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script>
        /**
         * ServerStore - Manages persistent state for server status
         */
        class ServerStore {
            constructor() {
                this.STORAGE_KEY = 'server_status_v1';
                this.state = this.load();
            }

            load() {
                const data = localStorage.getItem(this.STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            }

            save(servers) {
                this.state = servers;
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(servers));
            }

            updateServer(name, data) {
                this.state[name] = { ...this.state[name], ...data };
                this.save(this.state);
            }
        }

        /**
         * Main Application Controller
         */
        const app = {
            store: new ServerStore(),
            client: window.gameSound,
            refreshInterval: null,

            async init() {
                this.render(); // Initial render from cached state
                await this.refresh();
                this.startPolling();

                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) this.refresh();
                });
            },

            startPolling() {
                if (this.refreshInterval) clearInterval(this.refreshInterval);
                this.refreshInterval = setInterval(() => this.refresh(true), 15000);
            },

            async refresh(silent = false) {
                try {
                    const servers = await this.client.getServerStatus();
                    if (servers && Object.keys(servers).length > 0) {
                        this.store.save(servers);
                        this.render();
                        if (!silent) this.toast('📡 System states synchronized', 'success');
                    }
                } catch (e) {
                    console.error('Refresh failed:', e);
                    if (!silent) this.toast('⚠️ Sync failed: Network error', 'error');
                }
            },

            formatUptime(seconds) {
                if (!seconds) return '---';
                if (seconds < 60) return `${seconds}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
                return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
            },

            async controlServer(name, action) {
                const btn = event.currentTarget;
                const originalContent = btn.innerHTML;

                btn.disabled = true;
                btn.innerHTML = '...';

                console.log(`Command: ${action} -> ${name}`);

                let result;
                try {
                    if (action === 'restart') result = await this.client.restartServer(name);
                    else if (action === 'start') result = await this.client.startServer(name);
                    else if (action === 'stop') result = await this.client.stopServer(name);

                    if (result?.success) {
                        this.toast(`✅ ${name}: ${action} successful`, 'success');
                        setTimeout(() => this.refresh(true), 2000);
                    } else {
                        this.toast(`❌ ${name}: ${result?.message || 'Action failed'}`, 'error');
                    }
                } catch (e) {
                    this.toast(`🛑 Error: ${e.message}`, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            },

            async controlAll(action) {
                if (!confirm(`Are you sure you want to ${action} ALL services?`)) return;

                const names = Object.keys(this.store.state);
                this.toast(`🚀 Bulk ${action} sequence started...`, 'info');

                for (const name of names) {
                    // Skip sound-service for stop/restart to avoid killing the API host mid-stream
                    if (name === 'sound-service' && (action === 'stop' || action === 'restart')) continue;

                    try {
                        if (action === 'restart') await this.client.restartServer(name);
                        else if (action === 'start') await this.client.startServer(name);
                        else if (action === 'stop') await this.client.stopServer(name);
                    } catch (e) {
                        console.error(`Failed bulk ${action} for ${name}`);
                    }
                }
                setTimeout(() => this.refresh(), 3000);
            },

            render() {
                const grid = document.getElementById('serverGrid');
                const servers = this.store.state;

                if (Object.keys(servers).length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">Initializing system links...</div>';
                    return;
                }

                grid.innerHTML = Object.entries(servers).map(([name, info]) => `
                    <div class="server-card ${info.running ? 'running' : 'stopped'}" data-server="${name}">
                        <div class="card-header">
                            <div>
                                <div class="server-name">${name.replace(/-/g, ' ').toUpperCase()}</div>
                                <div style="font-size: 0.75rem; color: #64748b; font-family: monospace;">PORT: ${info.port}</div>
                            </div>
                            <div style="font-size: 0.8rem; font-weight: 600; color: ${info.running ? 'var(--neon-green)' : 'var(--neon-red)'}">
                                <span class="status-led"></span>
                                ${info.running ? 'ONLINE' : 'OFFLINE'}
                            </div>
                        </div>

                        <div class="stats-row">
                            <div class="stat-item">
                                <span class="stat-label">UPTIME</span>
                                <span class="stat-value">${this.formatUptime(info.uptime)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">RESTARTS</span>
                                <span class="stat-value">${info.restarts || 0}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">PROCESS ID</span>
                                <span class="stat-value">${info.pid || '---'}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">WATCHDOG</span>
                                <span class="stat-value" style="color: ${info.auto_restart ? 'var(--neon-green)' : '#475569'}">
                                    ${info.auto_restart ? 'ACTIVE' : 'DISABLED'}
                                </span>
                            </div>
                        </div>

                        <div class="controls">
                            ${info.running ?
                        `<button class="btn btn-stop" onclick="app.controlServer('${name}', 'stop')">SHUTDOWN</button>` :
                        `<button class="btn btn-start" onclick="app.controlServer('${name}', 'start')">POWER ON</button>`
                    }
                            <button class="btn btn-restart" onclick="app.controlServer('${name}', 'restart')">REBOOT</button>
                        </div>
                    </div>
                `).join('');
            },

            toast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';

                let icon = 'ℹ️';
                if (type === 'success') icon = '✅';
                if (type === 'error') icon = '❌';

                toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>

</html>
