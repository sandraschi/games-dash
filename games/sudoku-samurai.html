<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Sudoku</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme-switcher.js"></script>
    <style>
        #samuraiGrid {
            display: grid;
            grid-template-columns: repeat(21, 30px);
            grid-template-rows: repeat(21, 30px);
            gap: 0;
            margin: 20px auto;
            border: 3px solid #333;
            width: fit-content;
            position: relative;
        }

        .samurai-cell {
            width: 30px;
            height: 30px;
            border: 1px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            color: #000;
            cursor: pointer;
        }

        .samurai-cell.given {
            background: #E3F2FD;
            color: #1976D2;
            font-weight: 900;
        }

        .samurai-cell.selected {
            background: #FFEB3B !important;
        }

        .samurai-cell.error {
            background: #FFCDD2 !important;
            color: #C62828;
        }

        .samurai-cell.correct {
            background: #C8E6C9 !important;
        }

        .samurai-cell.empty {
            background: rgba(0, 0, 0, 0.1);
            cursor: default;
        }

        /* Grid borders - thicker lines for 3x3 box boundaries */
        .samurai-cell:nth-child(3n) {
            border-right: 2px solid #333;
        }

        .samurai-cell:nth-child(n+19):nth-child(-n+27),
        .samurai-cell:nth-child(n+46):nth-child(-n+54),
        .samurai-cell:nth-child(n+73):nth-child(-n+81),
        .samurai-cell:nth-child(n+100):nth-child(-n+108),
        .samurai-cell:nth-child(n+127):nth-child(-n+135) {
            border-bottom: 2px solid #333;
        }

        /* Adjust for samurai grid layout */
        .samurai-cell:nth-child(n+64):nth-child(-n+84),
        .samurai-cell:nth-child(n+106):nth-child(-n+126),
        .samurai-cell:nth-child(n+148):nth-child(-n+168),
        .samurai-cell:nth-child(n+190):nth-child(-n+210) {
            border-bottom: 2px solid #333;
        }

        .samurai-cell:nth-child(n+7):nth-child(-n+15),
        .samurai-cell:nth-child(n+28):nth-child(-n+36),
        .samurai-cell:nth-child(n+49):nth-child(-n+57) {
            border-right: 2px solid #333;
        }

        .samurai-cell:nth-child(n+358):nth-child(-n+366),
        .samurai-cell:nth-child(n+379):nth-child(-n+387),
        .samurai-cell:nth-child(n+400):nth-child(-n+408) {
            border-right: 2px solid #333;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 10px;
            margin: 20px auto;
            width: fit-content;
        }

        .number-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
        }

        .grid-info {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="/" class="back-button">← Back to Games</a>
        <a href="sudoku.html" class="back-button">← Back to Sudoku</a>
        <a href="sudoku-education.html" class="back-button" style="background: rgba(76, 175, 80, 0.3); border-color: #4CAF50;">📚 Learn Sudoku</a>

        <div class="game-header">
            <h1>⚔️ SAMURAI SUDOKU</h1>
            <div class="grid-info">21×21 grid • 5 overlapping 9×9 puzzles • Extra challenging!</div>
            <div class="status" id="status">Select Difficulty to Start</div>
        </div>

        <div class="game-controls">
            <button onclick="newGame('easy')">Easy</button>
            <button onclick="newGame('medium')">Medium</button>
            <button onclick="newGame('hard')">Hard</button>
            <button onclick="checkSolution()">Check</button>
            <button onclick="showHint()">Hint</button>
        </div>

        <div id="samuraiGrid"></div>

        <div class="number-pad">
            <button class="number-btn" onclick="placeNumber(1)">1</button>
            <button class="number-btn" onclick="placeNumber(2)">2</button>
            <button class="number-btn" onclick="placeNumber(3)">3</button>
            <button class="number-btn" onclick="placeNumber(4)">4</button>
            <button class="number-btn" onclick="placeNumber(5)">5</button>
            <button class="number-btn" onclick="placeNumber(6)">6</button>
            <button class="number-btn" onclick="placeNumber(7)">7</button>
            <button class="number-btn" onclick="placeNumber(8)">8</button>
            <button class="number-btn" onclick="placeNumber(9)">9</button>
            <button class="number-btn" onclick="placeNumber(0)">❌</button>
        </div>
    </div>

    <script src="sudoku-samurai.js"></script>
</body>
</html>
