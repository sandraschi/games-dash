<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <style>
        body { background: #0d1117; color: #e6edf3; }
        .game-container { max-width: 680px; margin: 0 auto; padding: 24px; }
        .game-header { text-align: center; margin-bottom: 20px; }
        .game-header h1 { font-size: 2rem; font-weight: 700; color: #3fb950; text-shadow: 0 0 20px rgba(63,185,80,0.4); letter-spacing: 0.5px; }
        .game-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 16px; font-size: 1.1rem; font-weight: 600; }
        .game-stats .score { color: #3fb950; }
        .game-stats .status { color: #8b949e; font-weight: 500; }
        .game-controls { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .game-controls button, .game-controls a button {
            background: #21262d; border: 1px solid #30363d; color: #e6edf3;
            padding: 10px 20px; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .game-controls button:hover, .game-controls a button:hover {
            background: #30363d; border-color: #3fb950; color: #3fb950;
        }
        .canvas-wrap { display: flex; justify-content: center; margin: 20px 0; }
        #gameCanvas {
            border-radius: 12px; box-shadow: 0 0 0 1px #30363d, 0 8px 24px rgba(0,0,0,0.5);
            image-rendering: pixelated; image-rendering: crisp-edges;
        }
        .speed-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; padding: 16px; background: #161b22; border-radius: 8px; border: 1px solid #21262d; }
        .speed-row label { color: #8b949e; font-size: 0.9rem; }
        .speed-row input[type="range"] { width: 140px; accent-color: #3fb950; }
        .speed-row #speedValue { color: #3fb950; font-weight: 600; min-width: 52px; }
        .speed-row button { padding: 6px 12px; font-size: 0.85rem; background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .speed-row button:hover { background: #30363d; color: #3fb950; }
        .hint { text-align: center; font-size: 0.85rem; color: #8b949e; margin-top: 16px; }
        .back-button { color: #8b949e; margin-bottom: 16px; display: inline-block; text-decoration: none; }
        .back-button:hover { color: #3fb950; }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="/index.html" class="back-button">Back to Games</a>

        <div class="game-header">
            <h1>Snake</h1>
            <div class="game-stats">
                <span class="score" id="score">Score: 0</span>
                <span class="status" id="status">Press SPACE to Start</span>
            </div>
        </div>

        <div class="game-controls">
            <button onclick="startGame()">Start</button>
            <button onclick="pauseGame()">Pause</button>
            <button onclick="location.reload()">New Game</button>
            <a href="../educational/snake-education.html" style="text-decoration:none"><button>Learn</button></a>
        </div>

        <div class="speed-row">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="50" max="800" value="200" step="50" oninput="updateSpeed(this.value)">
            <span id="speedValue">200ms</span>
            <button onclick="setSpeed(50)">Fast</button>
            <button onclick="setSpeed(200)">Normal</button>
            <button onclick="setSpeed(500)">Slow</button>
            <button onclick="setSpeed(800)">Very Slow</button>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <div class="hint">Arrow keys or WASD to move. +/- or 1-4 for speed.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 30;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let velocityX = 0;
        let velocityY = 0;
        let food = {x: 15, y: 15};
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;
        let powerUp = null;
        let obstacles = [];
        let gameSpeed = 200;
        let speedMultiplier = 1;
        let invincible = false;
        let invincibleTimer = 0;
        let scoreMultiplier = 1;

        // Power-up types
        const POWER_UPS = {
            speed: { color: '#FFD700', symbol: '⚡', effect: 'speed', duration: 5000 },
            slow: { color: '#4169E1', symbol: '🐌', effect: 'slow', duration: 5000 },
            invincibility: { color: '#FF1493', symbol: '🛡️', effect: 'invincible', duration: 3000 },
            double_score: { color: '#32CD32', symbol: '💰', effect: 'double_score', duration: 10000 },
            shrink: { color: '#FFA500', symbol: '📏', effect: 'shrink', duration: 1 },
            grow: { color: '#8A2BE2', symbol: '📈', effect: 'grow', duration: 1 }
        };

        // Food types
        const FOOD_TYPES = {
            normal: { color: '#FF0000', points: 10, symbol: '🍎' },
            bonus: { color: '#FFD700', points: 25, symbol: '⭐' },
            super: { color: '#FF1493', points: 50, symbol: '💎' },
            poison: { color: '#800080', points: -20, symbol: '☠️' }
        };

        let currentFoodType = 'normal';

        function drawGame() {
            if (!gameRunning || gamePaused) return;

            moveSnake();

            // Update invincible timer
            if (invincible && invincibleTimer > 0) {
                invincibleTimer -= 16; // ~60fps
                if (invincibleTimer <= 0) {
                    invincible = false;
                    invincibleTimer = 0;
                }
            }

            clearCanvas();
            drawFood();
            drawPowerUp();
            drawSnake();
            updateScore();

            gameLoop = setTimeout(drawGame, gameSpeed);
        }

        function clearCanvas() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const g = gridSize;
            ctx.strokeStyle = '#161b22';
            ctx.lineWidth = 1;
            for (let i = 1; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * g, 0);
                ctx.lineTo(i * g, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * g);
                ctx.lineTo(canvas.width, i * g);
                ctx.stroke();
            }
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawSnake() {
            const g = gridSize;
            const pad = 3;
            const rad = 4;
            snake.forEach((segment, index) => {
                const rx = segment.x * g + pad;
                const ry = segment.y * g + pad;
                const sz = g - pad * 2;
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#3fb950' : '#238636';
                ctx.shadowColor = isHead ? '#3fb950' : 'transparent';
                ctx.shadowBlur = isHead ? 8 : 0;
                roundRect(rx, ry, sz, sz, rad);
                ctx.fill();
                ctx.shadowBlur = 0;
                if (isHead) {
                    ctx.fillStyle = '#0d1117';
                    const cx = rx + sz / 2;
                    const cy = ry + sz / 2 - 2;
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI * 2);
                    ctx.arc(cx + 4, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawFood() {
            const foodType = FOOD_TYPES[currentFoodType];
            const cx = food.x * gridSize + gridSize / 2;
            const cy = food.y * gridSize + gridSize / 2;
            const r = gridSize / 2 - 5;
            ctx.shadowColor = foodType.color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = foodType.color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = 'bold 16px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillText(foodType.symbol, cx, cy);
        }

        function drawPowerUp() {
            if (!powerUp) return;
            const powerUpType = POWER_UPS[powerUp.type];
            const cx = powerUp.x * gridSize + gridSize / 2;
            const cy = powerUp.y * gridSize + gridSize / 2;
            const r = gridSize / 2 - 4;
            const pulse = Math.sin(Date.now() * 0.004) * 0.2 + 0.8;
            ctx.globalAlpha = pulse;
            ctx.shadowColor = powerUpType.color;
            ctx.shadowBlur = 10;
            ctx.fillStyle = powerUpType.color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillText(powerUpType.symbol, cx, cy);
        }

        function moveSnake() {
            const head = {
                x: snake[0].x + velocityX,
                y: snake[0].y + velocityY
            };

            snake.unshift(head);

            // Check wall collision (only if not invincible)
            if (!invincible) {
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }
            } else {
                // Wrap around edges when invincible
                if (head.x < 0) head.x = tileCount - 1;
                if (head.x >= tileCount) head.x = 0;
                if (head.y < 0) head.y = tileCount - 1;
                if (head.y >= tileCount) head.y = 0;
            }

            // Check self collision (only if not invincible)
            if (!invincible) {
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver();
                        return;
                    }
                }
            }

            if (head.x === food.x && head.y === food.y) {
                // Handle different food types
                const foodType = FOOD_TYPES[currentFoodType];
                score += foodType.points * scoreMultiplier;

                if (currentFoodType === 'poison') {
                    // Shrink snake for poison
                    if (snake.length > 2) {
                        snake.splice(-2); // Remove last 2 segments
                    }
                    if (window.gameSound) {
                        window.gameSound.playSound('wrong', { gameType: 'snake' });
                    }
                } else {
                    if (window.gameSound) {
                        window.gameSound.playSound('correct', { gameType: 'snake' });
                    }
                }

                placeFood();
            } else if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
                // Handle power-up collection
                activatePowerUp(powerUp.type);
                powerUp = null;
                score += 50 * scoreMultiplier; // Bonus points for power-up
                placeFood(); // Spawn new food

                if (window.gameSound) {
                    window.gameSound.playSound('level_complete', { gameType: 'snake' });
                }
            } else {
                snake.pop();
            }
        }


        function placeFood() {
            // Randomly choose food type
            const foodTypes = Object.keys(FOOD_TYPES);
            currentFoodType = foodTypes[Math.floor(Math.random() * foodTypes.length)];

            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount),
                type: currentFoodType
            };

            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (food.x === segment.x && food.y === segment.y) {
                    placeFood();
                    return;
                }
            }

            // 20% chance to spawn a power-up instead of food
            if (Math.random() < 0.2 && !powerUp) {
                spawnPowerUp();
            }
        }

        function spawnPowerUp() {
            const powerUpTypes = Object.keys(POWER_UPS);
            const randomType = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];

            powerUp = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount),
                type: randomType,
                spawnTime: Date.now()
            };

            // Make sure power-up doesn't spawn on snake or food
            for (let segment of snake) {
                if (powerUp.x === segment.x && powerUp.y === segment.y) {
                    spawnPowerUp();
                    return;
                }
            }
            if (powerUp.x === food.x && powerUp.y === food.y) {
                spawnPowerUp();
                return;
            }
        }

        function updateScore() {
            let statusText = 'Playing';
            if (invincible) statusText = 'Shield ' + Math.ceil(invincibleTimer / 1000) + 's';
            else if (scoreMultiplier > 1) statusText = scoreMultiplier + 'x Score';
            else if (speedMultiplier !== 1) statusText = speedMultiplier > 1 ? 'Fast' : 'Slow';
            document.getElementById('score').textContent = 'Score: ' + score;
            document.getElementById('status').textContent = statusText;
        }

        function activatePowerUp(type) {
            const powerUpType = POWER_UPS[type];
            const duration = powerUpType.duration;

            if (duration === 1) {
                // Instant effects
                if (type === 'shrink') {
                    if (snake.length > 3) {
                        snake.splice(-2); // Remove 2 segments
                    }
                } else if (type === 'grow') {
                    snake.push({x: snake[snake.length-1].x, y: snake[snake.length-1].y}); // Add segment
                }
            } else {
                // Timed effects
                if (type === 'speed') {
                    speedMultiplier = 2;
                    gameSpeed = Math.max(50, 200 / speedMultiplier);
                } else if (type === 'slow') {
                    speedMultiplier = 0.5;
                    gameSpeed = 200 / speedMultiplier;
                } else if (type === 'invincible') {
                    invincible = true;
                    invincibleTimer = duration;
                } else if (type === 'double_score') {
                    scoreMultiplier = 2;
                }

                // Reset effects after duration
                setTimeout(() => {
                    if (type === 'speed' || type === 'slow') {
                        speedMultiplier = 1;
                        gameSpeed = 200;
                    } else if (type === 'invincible') {
                        invincible = false;
                        invincibleTimer = 0;
                    } else if (type === 'double_score') {
                        scoreMultiplier = 1;
                    }
                }, duration);
            }

            // Visual feedback
            updateScore();
        }

        function setSpeed(speed) {
            gameSpeed = speed;
            speedMultiplier = 1; // Reset any active speed power-ups
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('status').textContent = 'Game Over - SPACE to restart';

            if (window.gameSound) {
                window.gameSound.playSound('game_over', { gameType: 'snake' });
            }

            ctx.fillStyle = 'rgba(13, 17, 23, 0.92)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f85149';
            ctx.font = 'bold 36px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 24);
            ctx.fillStyle = '#8b949e';
            ctx.font = '18px system-ui';
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 16);
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            velocityX = 1;
            velocityY = 0;
            score = 0;
            gameRunning = true;
            gamePaused = false;
            placeFood();
            document.getElementById('status').textContent = 'Playing';
            clearTimeout(gameLoop);
            drawGame();
        }

        function pauseGame() {
            gamePaused = !gamePaused;
            document.getElementById('status').textContent = gamePaused ? 'Paused' : 'Playing';
            if (!gamePaused && gameRunning) {
                drawGame();
            }
        }

        function updateSpeed(value) {
            gameSpeed = parseInt(value);
            document.getElementById('speedValue').textContent = gameSpeed + 'ms';
            document.getElementById('speedSlider').value = gameSpeed;
        }

        function setSpeed(speed) {
            gameSpeed = speed;
            document.getElementById('speedSlider').value = speed;
            document.getElementById('speedValue').textContent = speed + 'ms';
        }

        // Initialize speed controls
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('speedSlider').value = gameSpeed;
            document.getElementById('speedValue').textContent = gameSpeed + 'ms';
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
                e.preventDefault();
            }

            // Speed control shortcuts (work even when paused)
            if (e.key === '+' || e.key === '=') {
                setSpeed(Math.max(50, gameSpeed - 50));
                e.preventDefault();
            } else if (e.key === '-') {
                setSpeed(Math.min(800, gameSpeed + 50));
                e.preventDefault();
            } else if (e.key === '1') {
                setSpeed(50); // Fast
                e.preventDefault();
            } else if (e.key === '2') {
                setSpeed(200); // Normal
                e.preventDefault();
            } else if (e.key === '3') {
                setSpeed(500); // Slow
                e.preventDefault();
            } else if (e.key === '4') {
                setSpeed(800); // Very slow
                e.preventDefault();
            }

            if (!gameRunning || gamePaused) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (velocityY !== 1) {
                        velocityX = 0;
                        velocityY = -1;
                    }
                    break;
                case 'ArrowDown':
                    if (velocityY !== -1) {
                        velocityX = 0;
                        velocityY = 1;
                    }
                    break;
                case 'ArrowLeft':
                    if (velocityX !== 1) {
                        velocityX = -1;
                        velocityY = 0;
                    }
                    break;
                case 'ArrowRight':
                    if (velocityX !== -1) {
                        velocityX = 1;
                        velocityY = 0;
                    }
                    break;
            }
            e.preventDefault();
        });

        // Initialize
        clearCanvas();
        drawSnake();
        drawFood();
    </script>
</body>
</html>
