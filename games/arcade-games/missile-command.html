<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missile Command</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <style>
        #gameCanvas {
            display: block;
            margin: 20px auto;
            border: 3px solid #FFD700;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .game-info {
            text-align: center;
            color: #FFD700;
            margin: 10px;
        }
        .controls {
            text-align: center;
            color: #FFF;
            margin: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Missile Command</h1>
            <div style="position: absolute; top: 20px; left: 20px;">
                <a href="..\shared\dashboard.html" class="back-button">← Back to Games</a>
            </div>
            <div style="position: absolute; top: 20px; right: 20px;">
                <a href="../shared/tech-docs.html" class="back-button" style="background: rgba(76, 175, 80, 0.3); border-color: #4CAF50;">📚 Tech Docs</a>
            </div>
        </header>
        
        <div class="game-info">
            <div>Score: <span id="score">0</span> | Cities: <span id="cities">6</span> | Missiles: <span id="missiles">10</span> | Level: <span id="level">1</span></div>
            <div style="margin-top: 10px;">
                <label><input type="checkbox" id="aiToggle" onchange="toggleAI()"> 🤖 AI Assistant</label>
                <span id="aiStatus" style="margin-left: 15px; color: #00FF00;">OFF</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="controls">
            <p>🕹️ Controls: Click to fire missile at that location</p>
            <button onclick="startGame()" style="padding: 10px 20px; font-size: 1.1em; margin: 10px;">Start Game</button>
            <button onclick="pauseGame()" style="padding: 10px 20px; font-size: 1.1em; margin: 10px;">Pause</button>
        </div>
    </div>
    
    <script src="missile-command.js"></script>
</body>
</html>
