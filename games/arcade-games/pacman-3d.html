<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man 3D - Real 3D Maze with Three.js</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <script src="/js/theme-switcher.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        #game3d {
            width: 80vw;
            height: min(calc(80vw * 620 / 560), 80vh);
            margin: 15px auto;
            min-width: 280px;
            min-height: 310px;
        }
        #game3d canvas { display: block; width: 100%; height: 100%; border-radius: 8px; background: #0a0a14; }
        .game-controls { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .game-controls button { padding: 12px 20px; font-size: 16px; background: rgba(255,215,0,0.2); border: 2px solid #FFD700; border-radius: 8px; color: #FFD700; cursor: pointer; }
        .game-controls button:hover { background: rgba(255,215,0,0.4); }
        .game-stats { display: flex; gap: 20px; justify-content: center; margin: 10px 0; font-size: 18px; color: #FFD700; }
    </style>
</head>
<body>
    <a href="../shared/dashboard.html" class="back-button">Back to Games</a>
    <div class="container game-container">
        <h1>Pac-Man 3D</h1>
        <p>Real 3D maze with perspective. Use mouse to rotate view, Arrow keys or WASD to move. Collect dots, avoid ghosts.</p>
        <div class="game-stats">
            <span>Score: <span id="score">0</span></span>
            <span>Lives: <span id="lives">3</span></span>
        </div>
        <div id="game3d"></div>
        <div class="game-controls">
            <button onclick="startGame()">START</button>
            <button onclick="pauseGame()">PAUSE</button>
        </div>
        <div id="status" style="text-align:center; margin:10px;">Press START to play. Drag to rotate view.</div>
    </div>
    <script src="pacman-3d-threejs.js"></script>
</body>
</html>
