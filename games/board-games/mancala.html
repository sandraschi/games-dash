<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mancala - African Strategy Game</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>
    <link rel="stylesheet" href="/responsive-boards.css">
    <script src="/js/theme-switcher.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin: 10px 0;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .board-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            margin: 20px auto;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .mancala-board {
            display: grid;
            grid-template-columns: minmax(60px, 80px) repeat(6, 1fr) minmax(60px, 80px);
            grid-template-rows: repeat(2, minmax(80px, 120px));
            gap: min(10px, 2vw);
            margin: 20px auto;
            width: min(95vw, 900px);
            max-width: 900px;
            height: auto;
            grid-auto-flow: row;
        }
        
        .store {
            grid-row: 1 / 3;
            background: #8B4513;
            border: 3px solid #DEB887;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: min(2em, 5vw);
            font-weight: bold;
            color: #FFD700;
            width: 100%;
            min-height: 80px;
            height: 100%;
        }
        
        .pit {
            width: 100%;
            aspect-ratio: 1;
            min-width: 60px;
            max-width: 100px;
            background: #DEB887;
            border: 3px solid #8B4513;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(1.5em, 4vw);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #FFD700;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        
        .pit:hover {
            background: #A0522D;
            transform: scale(1.1);
        }
        
        .pit.empty {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pit.player1 {
            border-color: #FFD700;
        }
        
        .pit.player2 {
            border-color: #4169E1;
        }
        
        .status {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        
        .btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        /* Basic Mancala styling as fallback */
        .pit {
            background: #DEB887 !important;
            border: 3px solid #8B4513 !important;
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1.5em !important;
            font-weight: bold !important;
            color: #8B4513 !important;
            cursor: pointer !important;
            width: 100% !important;
            aspect-ratio: 1 !important;
            min-width: 60px !important;
        }

        .store {
            background: #8B4513 !important;
            border: 3px solid #DEB887 !important;
            border-radius: 10px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 2em !important;
            font-weight: bold !important;
            color: #FFD700 !important;
            grid-row: 1 / 3 !important;
            width: 100% !important;
            min-height: 80px !important;
        }
    </style>
</head>
<body>    <div style="text-align: center; margin: 20px 0; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 10px;">
        <a href="../shared/dashboard.html" class="back-button">Back to Games</a>
    </div>
    <div class="container">
        <div class="header">
            <h1>🌍 Mancala (Oware)</h1>
            <p>African Strategy Game - Seed Sowing</p>
        </div>
        
        <div class="status" id="status">Player 1's turn! Click a pit to sow seeds.</div>
        
        <div class="board-container">
            <div class="mancala-board" id="board"></div>
        </div>
        
        <div style="text-align: center;">
            <button class="btn" onclick="newGame()">New Game</button>
            <a href="mancala-education.html" style="text-decoration: none;">
                <button class="btn">📚 Learn & History</button>
            </a>
        </div>
    </div>
    
    <script>
(function(){
var gameState={pits:Array(2).fill(null).map(function(){return Array(6).fill(4);}),stores:[0,0],currentPlayer:0,gameActive:true};
function sowSeeds(player,pitIndex){
if(!gameState.gameActive||gameState.currentPlayer!==player)return;
if(gameState.pits[player][pitIndex]===0)return;
var seeds=gameState.pits[player][pitIndex];
gameState.pits[player][pitIndex]=0;
var currentPlayer=player,currentPit=pitIndex+1,lastLandedInStore=false;
while(seeds>0){
if(currentPit<6){gameState.pits[currentPlayer][currentPit]++;seeds--;currentPit++;}
else if(currentPit===6&&currentPlayer===player){gameState.stores[currentPlayer]++;seeds--;lastLandedInStore=seeds===0;currentPit=0;currentPlayer=currentPlayer===0?1:0;}
else{currentPit=0;currentPlayer=currentPlayer===0?1:0;gameState.pits[currentPlayer][currentPit]++;seeds--;currentPit++;}
}
var lastPit=currentPit-1;
if(currentPlayer!==player&&lastPit>=0&&lastPit<6&&(gameState.pits[currentPlayer][lastPit]===2||gameState.pits[currentPlayer][lastPit]===3)){
gameState.stores[player]+=gameState.pits[currentPlayer][lastPit];
gameState.pits[currentPlayer][lastPit]=0;
}
if(!lastLandedInStore)gameState.currentPlayer=gameState.currentPlayer===0?1:0;
var nextPits=gameState.pits[gameState.currentPlayer];
if(nextPits.every(function(n){return n===0;})){
var opponent=gameState.currentPlayer===0?1:0;
gameState.stores[opponent]+=gameState.pits[opponent].reduce(function(a,b){return a+b;},0);
gameState.pits[opponent]=[0,0,0,0,0,0];
endGame();
return;
}
if(gameState.pits[0].reduce(function(a,b){return a+b;},0)+gameState.stores[0]>=25||gameState.pits[1].reduce(function(a,b){return a+b;},0)+gameState.stores[1]>=25){endGame();return;}
updateDisplay();
}
function renderBoard(){
var boardEl=document.getElementById('board');
if(!boardEl)return;
boardEl.innerHTML='';
var store2=document.createElement('div');store2.className='store';store2.textContent=gameState.stores[1];boardEl.appendChild(store2);
for(var i=5;i>=0;i--){
var pit=document.createElement('div');pit.className='pit';
if(gameState.currentPlayer===1)pit.classList.add('player2');
if(gameState.pits[1][i]===0)pit.classList.add('empty');
pit.textContent=gameState.pits[1][i];pit.onclick=(function(j){return function(){sowSeeds(1,j);};})(i);
boardEl.appendChild(pit);
}
var store1=document.createElement('div');store1.className='store';store1.textContent=gameState.stores[0];boardEl.appendChild(store1);
for(var i=0;i<6;i++){
var pit=document.createElement('div');pit.className='pit';
if(gameState.currentPlayer===0)pit.classList.add('player1');
if(gameState.pits[0][i]===0)pit.classList.add('empty');
pit.textContent=gameState.pits[0][i];pit.onclick=(function(j){return function(){sowSeeds(0,j);};})(i);
boardEl.appendChild(pit);
}
}
function updateStatus(msg){var el=document.getElementById('status');if(el)el.textContent=msg;}
function updateDisplay(){renderBoard();updateStatus('Player '+(gameState.currentPlayer+1)+"'s turn! Click a pit to sow seeds.");}
function endGame(){
gameState.gameActive=false;
var s0=gameState.stores[0],s1=gameState.stores[1];
updateStatus(s0>s1?'Player 1 wins! Final score - Player 1: '+s0+', Player 2: '+s1:s1>s0?'Player 2 wins! Final score - Player 1: '+s0+', Player 2: '+s1:'Tie! Final score - Player 1: '+s0+', Player 2: '+s1);
renderBoard();
}
function newGame(){
gameState.pits=Array(2).fill(null).map(function(){return Array(6).fill(4);});
gameState.stores=[0,0];
gameState.currentPlayer=0;
gameState.gameActive=true;
updateDisplay();
}
window.newGame=newGame;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',newGame);
else newGame();
})();
    </script>
</body>
</html>
