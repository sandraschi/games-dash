<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers Game</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/responsive-boards.css">
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/device-adaptive.js"></script>
    <script src="/js/game-sound-client.js"></script>
    <style>
        /* Basic checker square styling as fallback */
        .checker-square {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 40px !important;
            min-width: 40px !important;
        }

        .checker-square.light {
            background-color: #f0d9b5 !important;
        }

        .checker-square.dark {
            background-color: #b58863 !important;
        }

        .checker-piece {
            width: min(60px, 80%);
            height: min(60px, 80%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(30px, 40%);
            border: 3px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .checker-piece.red {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a);
        }

        .checker-piece.black {
            background: radial-gradient(circle at 30% 30%, #555, #222);
        }

        .checker-piece.king::after {
            content: '♔';
            color: gold;
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="/" class="back-button">← Back to Games</a>
        <a href="checkers-education.html" class="back-button" style="background: rgba(76, 175, 80, 0.3); border-color: #4CAF50;">📚 Learn Checkers</a>
        
        <div class="game-header">
            <h1>⚫ Checkers</h1>
            <div class="status" id="status">Red's Turn</div>
        </div>

        <div class="game-controls">
            <button onclick="newGame()">New Game</button>
            <button onclick="undoMove()">Undo Move</button>
            <button onclick="toggleSound()" id="soundToggle">🔊 Sound: On</button>
            <button onclick="toggleAI()" id="aiToggle">🤖 Play vs AI</button>
        </div>

        <div class="game-controls" id="aiControls" style="display: none;">
            <label style="color: #fff; margin-right: 10px;">AI Difficulty:</label>
            <select id="aiLevel" style="padding: 8px; border-radius: 5px;">
                <option value="4">Easy - Depth 4</option>
                <option value="6">Medium - Depth 6</option>
                <option value="8" selected>Hard - Depth 8</option>
                <option value="10">Expert - Depth 10 (Very Strong!)</option>
                <option value="12">Master - Depth 12 (Near Perfect!)</option>
            </select>
            <span id="aiThinking" style="display: none; color: #FFD700; margin-left: 15px;">
                🤔 AI is thinking...
            </span>
            <div style="margin-top: 10px; color: #FFD700; font-size: 14px;">
                ⚠️ Checkers is a SOLVED game! At depth 12, AI plays perfectly.
            </div>
        </div>

        <div class="board-container">
            <div id="checkersBoard"></div>
        </div>

        <div class="score" id="score">
            Red: 12 | Black: 12
        </div>
    </div>

    <script>
        let board = [];
        let selectedSquare = null;
        let currentPlayer = 'red';
        let moveHistory = [];
        let mustCapture = null;

        // URL parameters for multiplayer functionality
        const urlParams = new URLSearchParams(window.location.search);
        const isMultiplayer = urlParams.get('multiplayer') === 'true';
        const gameId = urlParams.get('game_id');
        const myColor = urlParams.get('color'); // 'red' or 'black'

        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));

            // Place red pieces (top 3 rows)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = {color: 'red', isKing: false};
                    }
                }
            }

            // Place black pieces (bottom 3 rows)
            for (let row = 5; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = {color: 'black', isKing: false};
                    }
                }
            }
        }

        function renderBoard() {
            const boardElement = document.getElementById('checkersBoard');
            if (!boardElement) {
                console.error('Checkers board element not found!');
                // Try to create a fallback message
                const fallback = document.createElement('div');
                fallback.style.color = 'red';
                fallback.style.fontSize = '20px';
                fallback.style.padding = '20px';
                fallback.textContent = 'ERROR: Checkers board element not found!';
                document.body.appendChild(fallback);
                return;
            }
            console.log('Rendering checkers board...');
            boardElement.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `checker-square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;

                    // Add visible content for debugging
                    const coord = document.createElement('span');
                    coord.textContent = `${row},${col}`;
                    coord.style.fontSize = '8px';
                    coord.style.color = 'red';
                    coord.style.position = 'absolute';
                    coord.style.top = '0';
                    coord.style.left = '0';
                    square.appendChild(coord);

                    const piece = board[row][col];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `checker-piece ${piece.color} ${piece.isKing ? 'king' : ''}`;
                        square.appendChild(pieceDiv);
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardElement.appendChild(square);
                }
            }
            console.log('Board rendered with', boardElement.children.length, 'squares');

            updateStatus();
            updateScore();
        }

        function handleSquareClick(row, col) {
            if (selectedSquare) {
                const [selectedRow, selectedCol] = selectedSquare;
                if (isValidMove(selectedRow, selectedCol, row, col)) {
                    makeMove(selectedRow, selectedCol, row, col);
                }
                clearSelection();
            } else {
                const piece = board[row][col];
                if (piece && piece.color === currentPlayer) {
                    if (mustCapture && (mustCapture[0] !== row || mustCapture[1] !== col)) {
                        return;
                    }
                    selectedSquare = [row, col];
                    highlightValidMoves(row, col);
                }
            }
        }

        function highlightValidMoves(row, col) {
            const squares = document.querySelectorAll('.checker-square');
            squares.forEach(square => {
                const r = parseInt(square.dataset.row);
                const c = parseInt(square.dataset.col);
                if (r === row && c === col) {
                    square.classList.add('selected');
                } else if (isValidMove(row, col, r, c)) {
                    square.classList.add('valid-move');
                }
            });
        }

        function clearSelection() {
            selectedSquare = null;
            document.querySelectorAll('.checker-square').forEach(square => {
                square.classList.remove('selected', 'valid-move');
            });
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            if (board[toRow][toCol]) return false;

            const piece = board[fromRow][fromCol];
            const rowDiff = toRow - fromRow;
            const colDiff = Math.abs(toCol - fromCol);

            // Check if diagonal
            if (Math.abs(rowDiff) !== colDiff) return false;

            // Normal move (1 square)
            if (Math.abs(rowDiff) === 1) {
                if (hasCaptures(piece.color).length > 0) return false;
                
                if (piece.isKing) return true;
                return piece.color === 'red' ? rowDiff > 0 : rowDiff < 0;
            }

            // Capture move (2 squares)
            if (Math.abs(rowDiff) === 2) {
                const midRow = (fromRow + toRow) / 2;
                const midCol = (fromCol + toCol) / 2;
                const captured = board[midRow][midCol];

                if (captured && captured.color !== piece.color) {
                    if (piece.isKing) return true;
                    return piece.color === 'red' ? rowDiff > 0 : rowDiff < 0;
                }
            }

            return false;
        }

        function hasCaptures(color) {
            const captures = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.color === color) {
                        const directions = piece.isKing ? 
                            [[2, 2], [2, -2], [-2, 2], [-2, -2]] :
                            color === 'red' ? [[2, 2], [2, -2]] : [[-2, 2], [-2, -2]];

                        for (const [dr, dc] of directions) {
                            const newRow = row + dr;
                            const newCol = col + dc;
                            if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
                                const midRow = row + dr / 2;
                                const midCol = col + dc / 2;
                                const captured = board[midRow][midCol];
                                if (captured && captured.color !== color && !board[newRow][newCol]) {
                                    captures.push([row, col]);
                                }
                            }
                        }
                    }
                }
            }
            return captures;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            // Check multiplayer mode (using global urlParams)
            
            // In multiplayer, only allow moves on your turn
            if (isMultiplayer && currentPlayer !== myColor) {
                return;
            }
            
            const piece = board[fromRow][fromCol];
            const rowDiff = Math.abs(toRow - fromRow);

            moveHistory.push({
                from: {row: fromRow, col: fromCol},
                to: {row: toRow, col: toCol},
                piece: {color: piece.color, isKing: piece.isKing},
                captured: null
            });

            let captured = null;
            if (rowDiff === 2) {
                const midRow = (fromRow + toRow) / 2;
                const midCol = (fromCol + toCol) / 2;
                captured = board[midRow][midCol];
                moveHistory[moveHistory.length - 1].captured = {
                    piece: captured,
                    row: midRow,
                    col: midCol
                };
                board[midRow][midCol] = null;
            }

            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;

            // Play sound effects
            if (captured && window.gameSound) {
                window.gameSound.playSound('gong', { gameType: 'general' });
            } else if (window.gameSound) {
                window.gameSound.playSound('button_click', { gameType: 'general' });
            }

            // Check for king promotion
            if (!piece.isKing) {
                if ((piece.color === 'red' && toRow === 7) || (piece.color === 'black' && toRow === 0)) {
                    piece.isKing = true;
                }
            }

            // Check for additional captures
            if (captured) {
                const additionalCaptures = canCaptureFrom(toRow, toCol);
                if (additionalCaptures.length > 0) {
                    mustCapture = [toRow, toCol];
                    renderBoard();
                    return;
                }
            }

            mustCapture = null;
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
            
            // Send move in multiplayer mode (using global urlParams)
            if (isMultiplayer && window.sendMove && window.currentGame) {
                const game = window.currentGame();
                if (game && game.game_id) {
                    window.sendMove(game.game_id, JSON.stringify({fromRow, fromCol, toRow, toCol}));
                }
            }
            
            renderBoard();
            checkWinner();
        }

        function canCaptureFrom(row, col) {
            const piece = board[row][col];
            if (!piece) return [];

            const captures = [];
            const directions = piece.isKing ? 
                [[2, 2], [2, -2], [-2, 2], [-2, -2]] :
                piece.color === 'red' ? [[2, 2], [2, -2]] : [[-2, 2], [-2, -2]];

            for (const [dr, dc] of directions) {
                const newRow = row + dr;
                const newCol = col + dc;
                if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
                    const midRow = row + dr / 2;
                    const midCol = col + dc / 2;
                    const captured = board[midRow][midCol];
                    if (captured && captured.color !== piece.color && !board[newRow][newCol]) {
                        captures.push([newRow, newCol]);
                    }
                }
            }
            return captures;
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            const lastMove = moveHistory.pop();
            board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
            board[lastMove.to.row][lastMove.to.col] = null;

            if (lastMove.captured) {
                board[lastMove.captured.row][lastMove.captured.col] = lastMove.captured.piece;
            }

            mustCapture = null;
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
            renderBoard();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s Turn`;
            if (mustCapture) {
                status.textContent += ' - Must Continue Capture!';
            }
        }

        function updateScore() {
            let redCount = 0;
            let blackCount = 0;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        if (piece.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }

            document.getElementById('score').textContent = `Red: ${redCount} | Black: ${blackCount}`;
        }

        function checkWinner() {
            let redCount = 0;
            let blackCount = 0;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        if (piece.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }

            if (redCount === 0) {
                setTimeout(() => alert('Black Wins!'), 100);
            } else if (blackCount === 0) {
                setTimeout(() => alert('Red Wins!'), 100);
            }
        }

        function newGame() {
            initBoard();
            currentPlayer = 'red';
            moveHistory = [];
            selectedSquare = null;
            mustCapture = null;
            aiEnabled = false;
            renderBoard();
        }

        // Checkers AI - Minimax with Alpha-Beta (Checkers is SOLVED!)
        let aiEnabled = false;
        let aiLevel = 8;
        let aiThinking = false;

        function toggleAI() {
            aiEnabled = !aiEnabled;
            const btn = document.getElementById('aiToggle');
            const controls = document.getElementById('aiControls');

            if (aiEnabled) {
                btn.textContent = '👤 Play vs Human';
                btn.style.background = 'rgba(76, 175, 80, 0.3)';
                controls.style.display = 'block';
                alert('Checkers AI enabled!\n\nFun fact: Checkers was SOLVED in 2007 by Chinook program.\nPerfect play always results in a draw!\n\nAt depth 12, this AI plays near-perfectly.');
            } else {
                btn.textContent = '🤖 Play vs AI';
                btn.style.background = '';
                controls.style.display = 'none';
            }
        }

        function toggleSound() {
            if (window.gameSound) {
                const isEnabled = window.gameSound.isEnabled;
                if (isEnabled) {
                    window.gameSound.disable();
                    document.getElementById('soundToggle').textContent = '🔇 Sound: Off';
                } else {
                    window.gameSound.enable();
                    document.getElementById('soundToggle').textContent = '🔊 Sound: On';
                }
            } else {
                alert('Sound system not available. Make sure the sound service is running.');
            }
        }

        // Override makeMove to trigger AI
        const originalMakeMove = makeMove;
        makeMove = function(fromRow, fromCol, toRow, toCol) {
            originalMakeMove(fromRow, fromCol, toRow, toCol);
            
            // If AI enabled and it's black's turn
            if (aiEnabled && currentPlayer === 'black' && !aiThinking) {
                setTimeout(getCheckersAIMove, 500);
            }
        };

        async function getCheckersAIMove() {
            if (aiThinking) return;
            
            aiThinking = true;
            document.getElementById('aiThinking').style.display = 'inline';
            aiLevel = parseInt(document.getElementById('aiLevel').value);
            
            try {
                const bestMove = await minimaxCheckers(aiLevel);
                
                if (bestMove) {
                    makeMove(bestMove.fromRow, bestMove.fromCol, bestMove.toRow, bestMove.toCol);
                }
            } catch (error) {
                console.error('Checkers AI error:', error);
            } finally {
                aiThinking = false;
                document.getElementById('aiThinking').style.display = 'none';
            }
        }

        async function minimaxCheckers(maxDepth) {
            let bestScore = -Infinity;
            let bestMove = null;
            
            // Get all valid moves for black
            const moves = getAllValidMoves('black');
            
            for (const move of moves) {
                // Simulate move
                const captured = simulateMove(move);
                const score = minimaxCheckersRecursive(maxDepth - 1, -Infinity, Infinity, false);
                undoSimulatedMove(move, captured);
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
                
                // Yield to UI
                await new Promise(resolve => setTimeout(resolve, 0));
            }
            
            return bestMove;
        }

        function minimaxCheckersRecursive(depth, alpha, beta, isMaximizing) {
            // Terminal state or depth limit
            if (depth === 0) {
                return evaluateCheckersBoard();
            }
            
            const color = isMaximizing ? 'black' : 'red';
            const moves = getAllValidMoves(color);
            
            if (moves.length === 0) {
                // No moves = loss
                return isMaximizing ? -10000 : 10000;
            }
            
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (const move of moves) {
                    const captured = simulateMove(move);
                    const eval = minimaxCheckersRecursive(depth - 1, alpha, beta, false);
                    undoSimulatedMove(move, captured);
                    
                    maxEval = Math.max(maxEval, eval);
                    alpha = Math.max(alpha, eval);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (const move of moves) {
                    const captured = simulateMove(move);
                    const eval = minimaxCheckersRecursive(depth - 1, alpha, beta, true);
                    undoSimulatedMove(move, captured);
                    
                    minEval = Math.min(minEval, eval);
                    beta = Math.min(beta, eval);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function getAllValidMoves(color) {
            const moves = [];
            
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && piece.color === color) {
                        // Check all possible moves
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    moves.push({fromRow, fromCol, toRow, toCol});
                                }
                            }
                        }
                    }
                }
            }
            
            return moves;
        }

        function simulateMove(move) {
            const piece = board[move.fromRow][move.fromCol];
            const captured = board[move.toRow][move.toCol];
            
            board[move.toRow][move.toCol] = piece;
            board[move.fromRow][move.fromCol] = null;
            
            // Handle capture
            const rowDiff = Math.abs(move.toRow - move.fromRow);
            if (rowDiff === 2) {
                const captureRow = (move.fromRow + move.toRow) / 2;
                const captureCol = (move.fromCol + move.toCol) / 2;
                const capturedPiece = board[captureRow][captureCol];
                board[captureRow][captureCol] = null;
                return {captured: capturedPiece, row: captureRow, col: captureCol};
            }
            
            return null;
        }

        function undoSimulatedMove(move, captureInfo) {
            const piece = board[move.toRow][move.toCol];
            board[move.fromRow][move.fromCol] = piece;
            board[move.toRow][move.toCol] = null;
            
            if (captureInfo) {
                board[captureInfo.row][captureInfo.col] = captureInfo.captured;
            }
        }

        function evaluateCheckersBoard() {
            let score = 0;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        let pieceValue = piece.isKing ? 30 : 10;
                        
                        // Position bonus
                        if (piece.color === 'black') {
                            pieceValue += (7 - row); // Advance bonus
                        } else {
                            pieceValue += row; // Advance bonus
                        }
                        
                        // Center control bonus
                        const centerDist = Math.abs(row - 3.5) + Math.abs(col - 3.5);
                        pieceValue += (7 - centerDist);
                        
                        score += piece.color === 'black' ? pieceValue : -pieceValue;
                    }
                }
            }
            
            return score;
        }

        // Initialize game when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            // Initialize device adaptive system
            if (window.DeviceAdaptive) {
                const adaptiveLayout = window.DeviceAdaptive.adaptGameLayout(
                    document.querySelector('.container'),
                    'checkers'
                );
                console.log('🔴 Checkers adapted for:', adaptiveLayout);

                // Apply adaptive canvas sizing
                const canvasSize = window.DeviceAdaptive.getRecommendedCanvasSize('checkers');
                const boardElement = document.getElementById('checkersBoard');
                if (boardElement) {
                    boardElement.style.width = `${canvasSize.width}px`;
                    boardElement.style.height = `${canvasSize.height}px`;
                }
            }

            newGame();
        });
        
        // Multiplayer integration (variables declared globally above)
        
        // Disable AI in multiplayer mode
        if (isMultiplayer) {
            aiEnabled = false;
            const aiToggle = document.getElementById('aiToggle');
            if (aiToggle) aiToggle.style.display = 'none';
        }
        
        // Handle opponent moves
        window.handleOpponentMove = function(move) {
            if (!isMultiplayer || !gameRunning) return;
            
            try {
                const moveData = typeof move === 'string' ? JSON.parse(move) : move;
                const {fromRow, fromCol, toRow, toCol} = moveData;
                
                // Only process if it's opponent's turn
                if (currentPlayer !== myColor) {
                    makeMove(fromRow, fromCol, toRow, toCol);
                }
            } catch (error) {
                console.error('Error handling opponent move:', error);
            }
        };
    </script>
    <script src="multiplayer-simple.js"></script>
</body>
</html>
