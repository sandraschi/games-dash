<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Classic Board Game</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme-switcher.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            margin-bottom: 0;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 10px 0;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.8);
            flex-wrap: wrap;
            gap: 20px;
        }

        .player-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .player-info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .dice-display {
            font-size: 2em;
            margin: 10px 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .board-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .board {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 1;
            background: #f0f0f0;
            border: 3px solid #333;
            border-radius: 10px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            /* Add Monopoly board background pattern */
            background-image:
                /* Corner squares */
                radial-gradient(circle at 5% 5%, #8B4513 2px, transparent 2px),
                radial-gradient(circle at 95% 5%, #DDA0DD 2px, transparent 2px),
                radial-gradient(circle at 95% 95%, #FF6347 2px, transparent 2px),
                radial-gradient(circle at 5% 95%, #4169E1 2px, transparent 2px),
                /* Property color bands */
                linear-gradient(to right,
                    #8B4513 0% 9%,   /* Brown */
                    #87CEEB 9% 27%,  /* Light Blue */
                    #DDA0DD 27% 45%, /* Pink */
                    #FFA500 45% 63%, /* Orange */
                    #FF0000 63% 81%, /* Red */
                    #FFFF00 81% 99%, /* Yellow */
                    #90EE90 99% 100% /* Green */
                );
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 8%, 8% 100%, 100% 8%, 8% 100%, 100% 8%, 8% 100%, 100% 8%, 8% 100%, 100% 8%, 8% 100%, 100% 8%, 8% 100%;
        }
        
        .property {
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            padding: 3px;
            text-align: center;
            position: relative;
            min-height: 50px;
            line-height: 1.1;
        }

        /* Responsive adjustments for full-width board */
        @media (max-width: 768px) {
            .game-info-bar {
                flex-direction: column;
                gap: 15px;
                padding: 10px 15px;
            }

            .player-info {
                justify-content: space-around;
                width: 100%;
            }

            .controls {
                justify-content: center;
                gap: 8px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 0.9em;
            }

            .board-container {
                padding: 10px;
            }

            .property {
                font-size: 0.6em;
                min-height: 35px;
                padding: 2px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2em;
            }

            .game-info-bar {
                padding: 8px 10px;
            }

            .player-info-item {
                padding: 6px 10px;
                font-size: 0.9em;
            }

            .controls {
                gap: 5px;
            }

            .btn {
                padding: 6px 8px;
                font-size: 0.8em;
            }

            .board-container {
                padding: 5px;
            }

            .property {
                font-size: 0.5em;
                min-height: 30px;
                padding: 1px;
            }
        }

        /* Property color bars */
        .property::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: currentColor;
            border-radius: 3px 3px 0 0;
        }

        /* Property icons and enhancements */
        .property.brown::before { background: #8B4513; }
        .property.lightblue::before { background: #87CEEB; }
        .property.pink::before { background: #DDA0DD; }
        .property.orange::before { background: #FFA500; }
        .property.red::before { background: #FF0000; }
        .property.yellow::before { background: #FFFF00; }
        .property.green::before { background: #90EE90; }
        .property.darkblue::before { background: #00008B; }

        /* Special property types */
        .property.railroad::before {
            background: #000;
            content: '🚂';
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .property.utility::before {
            background: #FFF;
            border: 1px solid #000;
            content: '⚡';
            color: #FFD700;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .property.chance::before {
            background: #FF6B6B;
            content: '?';
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .property.community-chest::before {
            background: #4CAF50;
            content: '📦';
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Corner squares */
        .property.go {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-weight: bold;
            font-size: 0.9em;
        }

        .property.go::before {
            content: '🏁';
            font-size: 24px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .property.jail {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            color: white;
        }

        .property.jail::before {
            content: '🚔';
            font-size: 20px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .property.free-parking {
            background: linear-gradient(135deg, #2ED573 0%, #26A69A 100%);
            color: white;
        }

        .property.free-parking::before {
            content: '🅿️';
            font-size: 20px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .property.go-to-jail {
            background: linear-gradient(135deg, #FF3838 0%, #FF6B6B 100%);
            color: white;
        }

        .property.go-to-jail::before {
            content: '👮';
            font-size: 18px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .property.owned-player {
            background: rgba(76, 175, 80, 0.8);
            color: #fff;
            border: 2px solid #4CAF50;
        }

        .property.owned-player::after {
            content: '🏠';
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            opacity: 0.8;
        }

        .property.owned-ai {
            background: rgba(244, 67, 54, 0.8);
            color: #fff;
            border: 2px solid #F44336;
        }

        .property.owned-ai::after {
            content: '🤖';
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .player-token {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            border: 2px solid #000;
        }
        
        .player-token.player {
            background: #2196F3;
        }
        
        .player-token.ai {
            background: #FF9800;
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .player-info {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .player-info.active {
            border: 2px solid #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .status {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .dice-display {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 10px;">
            <a href="/" class="back-button">← Back to Games</a>
            <a href="strategy-games/monopoly-education.html" class="back-button" style="background: rgba(76, 175, 80, 0.3); border-color: #4CAF50; margin-left: 10px;">📚 Learn & History</a>
        </div>
        
        <div class="header">
            <h1>🏠 Monopoly - Enhanced Edition</h1>
            <p style="color: #FFD700;">✨ Visual property cards, themed corners, and Monopoly branding!</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <a href="strategy-games/monopoly-education.html" style="padding: 8px 16px; background: rgba(255, 215, 0, 0.2); border: 2px solid #FFD700; color: #FFD700; text-decoration: none; border-radius: 6px; font-size: 0.9em;">
                    📚 Learn Rules
                </a>
                <div style="padding: 8px 16px; background: rgba(76, 175, 80, 0.2); border: 2px solid #4CAF50; color: #4CAF50; border-radius: 6px; font-size: 0.9em;">
                    🎨 Enhanced Graphics
                </div>
            </div>
        </div>
        
        <div class="status" id="status">Your turn! Roll the dice.</div>

        <!-- Game info bar above board -->
        <div class="game-info-bar">
            <div class="player-info">
                <div class="player-info-item active" id="player-info">
                    <strong>You</strong><br>
                    $<span id="money-player">1500</span> • <span id="props-player">0</span> properties
                </div>
                <div class="player-info-item" id="ai-info">
                    <strong>AI</strong><br>
                    $<span id="money-ai">1500</span> • <span id="props-ai">0</span> properties
                </div>
            </div>

            <div class="dice-display" id="dice-display">🎲 🎲</div>

            <div class="controls">
                <button class="btn" id="roll-btn" onclick="rollDice()">🎲 Roll Dice</button>
                <button class="btn" id="buy-btn" onclick="buyProperty()" style="display: none;">💰 Buy Property</button>
                <button class="btn" onclick="newGame()">🔄 New Game</button>
                <a href="strategy-games/monopoly-education.html" style="text-decoration: none;">
                    <button class="btn" style="background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);">📚 Learn</button>
                </a>
            </div>
        </div>

        <!-- Full-width board -->
        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
    </div>
    
    <script src="strategy-games/monopoly.js"></script>
</body>
</html>
