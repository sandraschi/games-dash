<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenga - Games Collection</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/responsive-boards.css">
    <script src="/js/global-error-handler.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/device-adaptive.js"></script>
    <script src="../strategy-games/jenga.js"></script>
    <style>
        .jenga-ui {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            color: gold;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .game-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .stat {
            font-size: 18px;
            color: #FFD700;
        }

        .game-canvas {
            width: 100%;
            height: 600px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tower-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 400px;
        }

        .tower-level {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
        }

        .tower-level:nth-child(even) {
            margin-left: 15px;
        }

        .jenga-block {
            width: 60px;
            height: 20px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            border: 1px solid #654321;
            border-radius: 3px;
            position: relative;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .jenga-block:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .jenga-block.dragging {
            cursor: grabbing;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .jenga-block.removed {
            opacity: 0;
            transform: translateY(100px) rotate(45deg);
        }

        .jenga-block.falling {
            animation: fall 0.5s ease-in forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(200px) rotate(90deg);
                opacity: 0;
            }
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .start-screen h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: gold;
        }

        .difficulty-info {
            margin-top: 30px;
            text-align: left;
            max-width: 500px;
        }

        .difficulty-info h3 {
            color: #FFD700;
            margin-bottom: 15px;
        }

        .difficulty-info ul {
            list-style: none;
            padding: 0;
        }

        .difficulty-info li {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .game-messages {
            margin-top: 20px;
            min-height: 50px;
        }

        .game-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .game-message.success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .game-message.error {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }

        @media (max-width: 768px) {
            .jenga-ui {
                padding: 10px;
            }

            .game-header h1 {
                font-size: 2em;
            }

            .game-canvas {
                height: 400px;
            }

            .jenga-block {
                width: 45px;
                height: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container game-container">
        <a href="/games/shared/dashboard.html" class="back-button">← Back to Games</a>

        <div id="jenga-container">
            <!-- Game UI will be inserted here by JavaScript -->
        </div>
    </div>
</body>
</html>
