<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jpen - My Vocabulary</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script> <!-- Reusing existing styles -->
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/global-error-handler.js"></script>

    <style>
        /* Specific overrides for vocabulary */
        .dict-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            background: rgba(40, 40, 40, 0.8);
            border-color: #ffd700;
        }

        .vocab-expression {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 2rem;
            color: #ffd700;
            font-weight: 700;
        }

        .vocab-reading {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .vocab-translation {
            color: white;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .vocab-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: auto;
            /* Push to bottom */
        }

        .vocab-tag {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .delete-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            color: #ff4444;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffd700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <a href="../japan/kanji-table.html" class="nav-item">
            <i class="fas fa-th"></i> Kanji Table
        </a>
        <a href="../shared/dictionary.html" class="nav-item">
            <i class="fas fa-book"></i> Dictionary
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-star"></i> My Words
        </a>
    </div>

    <div class="dict-container">
        <h1><i class="fas fa-star" style="color: #ffd700;"></i> My Vocabulary</h1>

        <div class="header-actions">
            <div class="stat-card">
                <div class="stat-value" id="statsTotal">0</div>
                <div class="stat-label">Words Learned</div>
            </div>

            <div style="flex: 1; display: flex; justify-content: flex-end; gap: 1rem;">
                <input type="text" id="filterInput" placeholder="Filter my words..."
                    style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 0.8rem; border-radius: 8px; width: 300px;">

                <select id="sortSelect"
                    style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 0.8rem; border-radius: 8px;">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="alpha">A-Z</option>
                </select>
            </div>
        </div>

        <div id="vocabGrid" class="vocab-grid">
            <!-- Cards injected here -->
            <div style="text-align: center; color: rgba(255,255,255,0.5); padding: 2rem; grid-column: 1/-1;">
                Loading your words...
            </div>
        </div>
    </div>

    <script src="vocabulary.js"></script>
</body>

</html>
