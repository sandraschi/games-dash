[project]
name = "games-mcp"
version = "0.1.0"
description = "MCP server for correspondence chess and game analysis via Claude/Cursor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==2.14.1",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
games-mcp = "games_mcp.mcp_server_sota:main"

[tool.hatch.build.targets.wheel]
packages = ["src/games_mcp"]
